<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wally</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <!-- Défilement inertiel. Script CLASSIQUE, donc évalué avant le module
       `app.js` : `window.Lenis` est posé quand app.js s'exécute.
       Vendoré — cf. public-ui/vendor/PROVENANCE.md. -->
  <script src="/vendor/lenis.min.js"></script>
</head>
<body>
  <!-- Décor : trois couches fixes peuplées par app.js. -->
  <div class="bg-halos" id="bg-halos"></div>
  <div class="bg-icons" id="bg-icons"></div>
  <div class="bg-veil"></div>

  <nav class="nav">
    <a class="nav-brand" href="/" data-route="/">
      <video class="avatar" src="/wally.webm" aria-hidden="true" autoplay loop muted playsinline preload="auto"></video>
      <span class="wordmark" data-nom-bot="maj">WALLY</span>
    </a>
    <div class="nav-links" id="nav-links">
      <a class="nav-link" href="/" data-route="/">ACCUEIL</a>
      <a class="nav-link" href="/chat" data-route="/chat">CHAT</a>
      <a class="nav-link" href="/galerie" data-route="/galerie">GALERIE</a>
      <a class="nav-link" href="/clips" data-route="/clips">CLIPS</a>
      <a class="nav-link" href="/tcg" data-route="/tcg">TCG<span class="soon">BIENTÔT</span></a>
    </div>
    <div class="nav-right">
      <div class="nav-state" id="nav-state"><span class="dot"></span>EN LIGNE</div>
      <div class="auth" id="auth"></div>
    </div>
  </nav>

  <!-- Barre d'onglets du pouce — téléphone SEULEMENT (≤ 620 px, cf. style.css).
       Le défilement horizontal des onglets du haut coupait « TCG » en « T »
       dès 320 px, et rien ne disait qu'il restait quelque chose à droite.
       Elle ne recouvre rien : `.vue` lui réserve sa hauteur en bas de page.
       Classe `tab` et NON `nav-link` : le test « un seul onglet actif » du
       smoke test compte les `.nav-link`, et deux barres en donneraient deux.
       `syncNav()` marque les deux familles, le routeur intercepte déjà tout
       ce qui porte `data-route`. -->
  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" href="/" data-route="/">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      <span class="tab-lbl">ACCUEIL</span>
    </a>
    <a class="tab" href="/chat" data-route="/chat">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H4l2.2-3A8 8 0 1 1 21 12Z"/></svg>
      <span class="tab-lbl">CHAT</span>
    </a>
    <a class="tab" href="/galerie" data-route="/galerie">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m3.5 17 4.8-4.4L14 18"/><path d="m13 14.5 3.2-2.8L20.5 16"/></svg>
      <span class="tab-lbl">GALERIE</span>
    </a>
    <a class="tab" href="/clips" data-route="/clips">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M10 9.5 15 12l-5 2.5Z"/></svg>
      <span class="tab-lbl">CLIPS</span>
    </a>
    <a class="tab" href="/tcg" data-route="/tcg">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><rect x="4" y="3" width="12" height="17" rx="2.2"/><path d="M17.5 6.2 20 7.1a1.6 1.6 0 0 1 1 2l-3 9.3"/></svg>
      <span class="tab-lbl">TCG</span><span class="tab-soon" aria-hidden="true"></span>
    </a>
  </nav>

  <main class="vue" id="vue"></main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-caption" id="modal-caption"></div>
    </div>
  </div>

  <div class="companion" id="companion" aria-hidden="true">
    <div class="halo"></div>
    <video src="/wally.webm" autoplay loop muted playsinline></video>
    <div class="companion-label">il te regarde lire</div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
