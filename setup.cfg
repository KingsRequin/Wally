# Ce fichier n'existe que pour `mutmut` (`python3 -m mutmut run`, puis
# `python3 -m mutmut results` ou `browse`). Le projet
# n'est pas un paquet installable et le Dockerfile ne fait aucun `pip install .`.
[mutmut]
source_paths = bot

# mutmut COPIE le dépôt dans `mutants/` puis y lance pytest avec `--rootdir=.`.
# Tout ce qui n'est pas copié n'existe pas pour les tests :
#   · pytest.ini porte `asyncio_mode = auto` — sans lui, TOUS les tests async
#     de ce dépôt échouent, et chaque mutant passerait pour « tué » alors que
#     c'est la configuration qui manque ;
#   · config.yaml est lu par `Config.load()` ;
#   · tests/ est déjà copié d'office par mutmut.
# Le reste de la liste a été DÉRIVÉ des échecs, pas deviné : `tests/scripts/`
# importe `scripts.*`, `test_emotion_beloved` lit `config.example.yaml`, et
# `test_le_fichier_roadmap_entre_dans_l_image` lit `.dockerignore` ET le
# `Dockerfile`. Un fichier oublié ici ne rend pas un test rouge quelque part :
# il fait échouer la collecte de stats ENTIÈRE, donc zéro mutant exécuté.
also_copy =
    pytest.ini
    config.yaml
    config.example.yaml
    .env.example
    mypy.ini
    ruff.toml
    scripts/
    public-ui/
    extension-musique/
    Dockerfile
    .dockerignore
    docker-compose.yml
    requirements.txt
    CLAUDE.md
    README.md
    ROADMAP.md

# `addopts = -n 4 --dist loadfile` de pytest.ini s'appliquerait à CHAQUE mutant,
# en plus du parallélisme de mutmut : quatre workers xdist démarrés et jetés par
# mutant testé. Ces arguments sont ajoutés APRÈS ceux de la config, donc `-n 0`
# gagne et rend la main à mutmut pour la parallélisation.
# ⚠️ ConfigParser découpe cette valeur par LIGNE, pas par espace : un
# « --deselect chemin » sur une seule ligne arrive à pytest en UN argument et
# fait tomber la passe entière (BadTestExecutionCommandsException). Un jeton par
# ligne.
#
# Les deux tests désélectionnés mesurent le DÉPÔT (compte d'`except` muets,
# compte d'erreurs mypy) et non un comportement. Dans `mutants/`, le module ciblé
# est réécrit avec tous ses mutants côte à côte — `emotion.py` passe de 1 310
# lignes à 3,8 Mo — donc leur compte explose : « 178 gestionnaires muets, cliquet
# à 113 ». Faux positif de construction, étranger à ce qu'on mesure ici.
pytest_add_cli_args =
    -n
    0
    --deselect
    tests/test_garde_fous_qualite.py::test_aucun_nouveau_gestionnaire_muet
    --deselect
    tests/test_garde_fous_qualite.py::test_aucune_nouvelle_erreur_de_type

# `mutate_only_covered_lines` reste à FALSE, et ce n'est pas un oubli. À True,
# mutmut mesure d'abord la couverture, puis vide `sys.modules` pour recharger
# les sources mutées (`code_coverage._unload_modules_not_in`). numpy 2.4+ refuse
# ce rechargement — « cannot load module more than once per process », une garde
# ajoutée en amont contre le double chargement d'extensions C — et la collecte
# de stats meurt AVANT le premier mutant. Le prix à payer : les lignes non
# couvertes produisent des survivants garantis. mutmut les range à part (code de
# sortie 33, « no tests ») plutôt que parmi les survivants, et c'est une
# information utile plutôt qu'un bruit : une ligne neuve que personne n'exécute
# est déjà un trou de test.

# --- Périmètre ---------------------------------------------------------------
# `source_paths = bot` ne dit PAS « mute tout bot/ » : c'est le périmètre COPIÉ.
# Ce qui est réellement muté est `only_mutate`, et ce doit rester une poignée de
# fichiers. Mesuré le 2026-08-26 sur le dépôt entier : mutmut 3.7 réécrit chaque
# module en un fichier portant TOUS ses mutants côte à côte — `twitch/handlers.py`
# passe de 1 600 lignes à 43,8 Mo, et sa seule COMPILATION demande 4,2 s et
# 1,9 Go de RSS. La passe s'est arrêtée d'épuisement après une journée, à 65
# fichiers sur 220, sans avoir exécuté un seul mutant.
only_mutate =
    bot/core/emotion.py

# Les TESTS, eux, ne se bornent pas. La collecte de stats de mutmut associe chaque
# fonction aux tests qui l'exercent, et c'est cette table qui décide ensuite quels
# tests chaque mutant relance — un run complet de la suite est payé UNE fois, pas
# une fois par mutant. Restreindre la sélection ferait passer pour « non couvert »
# ce qui n'est qu'absent de la liste : essayé le 2026-08-26, `world_event` était
# compté sans test alors que `tests/test_emotion_world_events.py` l'exerce.
