[pytest]
asyncio_mode = auto

# La suite complète passe de 134 s à 55 s sur les 6 cœurs de CT100. Le surcoût
# sur un seul fichier est de 0,4 s — assez faible pour que le parallèle soit le
# défaut plutôt qu'un drapeau qu'on oublie.
#
# `loadfile` et PAS `load` : les fixtures `autouse` de `tests/conftest.py`
# isolent l'apprentissage émotionnel et les graphes du journal PAR FICHIER.
# Éclater un même fichier sur plusieurs workers les remettrait en concurrence
# sur les mêmes chemins de prod (cf. le graphe du journal écrasé 3 mois durant).
#
# Pour revenir en séquentiel — mise au point d'un test instable, pdb, trace
# lisible : `python3 -m pytest tests/... -n 0`
addopts = -n 4 --dist loadfile
