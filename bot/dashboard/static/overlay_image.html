<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Wally Image Overlay</title>
<!-- ⚠️ SOURCE OBS OBSOLÈTE — remplacée par la zone `image` de l'overlay
     principal (`/overlay-<scène>`), où elle se place, se dimensionne et
     s'éteint comme les autres éléments depuis le panneau de mise en scène.
     Le contenu de cette page a été porté dans `overlay.js`.

     À FAIRE dans OBS : supprimer cette source, puis rendre visible l'élément
     « Image de la galerie » sur les scènes voulues. Tant que les deux
     coexistent, une image poussée par `!image` s'affiche EN DOUBLE.

     Gardée servie parce qu'elle est peut-être encore dans des scènes OBS. -->
<!-- Hébergé ici, pas sur un CDN : une source de live ne doit pas dépendre du
     réseau sortant d'OBS. Sans accès, la page perdait TOUTES ses animations. -->
<link rel="stylesheet" href="/static/animate.min.css">
<style>
  /* Même source de live que l'overlay principal : mêmes polices, même palette.
     Cette page portait encore Segoe UI et le cyan `#06b6d4` du DASHBOARD, que
     l'overlay n'a jamais eu — deux sources côte à côte sur le même stream. */
  @font-face {
    font-family: "Fredoka";
    src: url("/static/fonts/fredoka.woff2") format("woff2");
    font-weight: 300 700;
    font-display: swap;
  }
  @font-face {
    font-family: "Bangers";
    src: url("/static/fonts/bangers.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  :root {
    --who:  #b79cff;
    --line: rgba(255, 255, 255, .14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3vh; }
  #image-container { display: none; max-width: 90vw; max-height: 90vh; }

  .overlay-frame {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.1),
      0 12px 40px rgba(0, 0, 0, 0.6),
      0 0 80px rgba(183, 156, 255, 0.08);
  }

  #overlay-img {
    display: block;
    max-width: 88vw;
    max-height: 75vh;
    object-fit: contain;
  }

  #overlay-credit {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 24px 16px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.3) 60%, transparent 100%);
    font-family: "Fredoka", 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  #overlay-credit .credit-label {
    font-family: "Bangers", 'Segoe UI', sans-serif;
    font-size: 1.8rem;
    letter-spacing: .04em;
    color: rgba(255, 255, 255, 0.7);
  }

  #overlay-credit .credit-name {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--who);
    text-shadow: 0 0 20px rgba(183, 156, 255, 0.4);
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>
<div id="image-container">
  <div class="overlay-frame">
    <img id="overlay-img" src="" alt="">
    <div id="overlay-credit"></div>
  </div>
</div>
<script>
(function() {
  const container = document.getElementById('image-container');
  const img = document.getElementById('overlay-img');
  let hideTimeout = null;
  // Gardée en portée de module : le handler de fin de fondu doit pouvoir être
  // retiré DE L'EXTÉRIEUR. Une image chassée pendant sa sortie déclenche
  // `animationcancel`, pas `animationend` — le handler survivait et se
  // déclenchait à la fin de l'animation d'ENTRÉE de la suivante, qui
  // disparaissait alors définitivement.
  let endHandler = null;

  function clearEndHandler() {
    if (endHandler) {
      container.removeEventListener('animationend', endHandler);
      endHandler = null;
    }
  }

  const sse = new EventSource('/api/public/sse/overlay-image');

  sse.addEventListener('show_image', function(e) {
    const data = JSON.parse(e.data);
    const animIn = data.animation_in || 'fadeIn';
    const animOut = data.animation_out || 'fadeOut';
    const duration = (data.display_duration || 15) * 1000;
    const animDuration = (data.animation_duration || 1) + 's';

    if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
    clearEndHandler();

    img.src = data.image_url;
    var credit = document.getElementById('overlay-credit');
    credit.textContent = '';
    if (data.username) {
      var label = document.createElement('span');
      label.className = 'credit-label';
      label.textContent = 'par';
      var name = document.createElement('span');
      name.className = 'credit-name';
      name.textContent = data.username;
      credit.appendChild(label);
      credit.appendChild(name);
    }
    container.style.display = 'block';
    container.style.setProperty('--animate-duration', animDuration);
    container.className = 'animate__animated animate__' + animIn;

    hideTimeout = setTimeout(function() {
      container.className = 'animate__animated animate__' + animOut;
      endHandler = function() {
        clearEndHandler();
        container.style.display = 'none';
        container.className = '';
        img.src = '';
      };
      container.addEventListener('animationend', endHandler, { once: true });
    }, duration);
  });

  // `EventSource` se reconnecte tout seul, et `onerror` retombe à CHAQUE
  // tentative : sans annulation, les rechargements s'empilaient pendant une
  // coupure. Un seul est armé, et il est désamorcé dès que le flux repart.
  let reloadTimer = null;
  sse.onerror = function() {
    if (reloadTimer === null) {
      reloadTimer = setTimeout(function() { location.reload(); }, 30000);
    }
  };
  sse.onopen = function() {
    if (reloadTimer !== null) { clearTimeout(reloadTimer); reloadTimer = null; }
  };
})();
</script>
</body>
</html>
