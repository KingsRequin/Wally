<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wally 3D — maquette</title>
  <style>
    :root {
      --damier: 22px;
      --fond: #1b1b20;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 28px 20px 40px;
      background: var(--fond);
      color: #e8e6e3;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
    p.sous { margin: 0; max-width: 620px; text-align: center; color: #9a9aa4; }

    /* Les deux vignettes partagent exactement le même cadre : c'est la seule
       façon de juger un remplacement d'avatar, côte à côte et à même taille. */
    .scene {
      display: flex;
      align-items: flex-end;
      gap: 26px;
    }
    .vignette {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .cadre {
      width: 300px;
      height: 380px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, .08);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    /* Damier : sans lui, impossible de voir si le rendu est bien détouré —
       or c'est tout ce qui compte pour une source OBS. */
    body[data-fond="damier"] .cadre {
      background-image:
        linear-gradient(45deg, #2c2c33 25%, transparent 25%, transparent 75%, #2c2c33 75%),
        linear-gradient(45deg, #2c2c33 25%, transparent 25%, transparent 75%, #2c2c33 75%);
      background-size: var(--damier) var(--damier);
      background-position: 0 0, calc(var(--damier) / 2) calc(var(--damier) / 2);
      background-color: #232329;
    }
    body[data-fond="clair"] { --fond: #eceaf2; color: #24242c; }
    body[data-fond="clair"] .cadre { background: #f7f5fb; }
    body[data-fond="clair"] p.sous { color: #5c5c68; }
    body[data-fond="jeu"] .cadre {
      background: linear-gradient(160deg, #4a6fa5 0%, #7a9b76 55%, #d8a05a 100%);
    }
    canvas, .cadre video { width: 100%; height: 100%; display: block; }
    .cadre video { object-fit: contain; }
    .etiquette { font-size: 12px; color: #8b8b96; letter-spacing: .3px; }
    body[data-fond="clair"] .etiquette { color: #6a6a76; }

    .controles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .05);
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover { background: rgba(255, 255, 255, .1); }
    button[aria-pressed="true"] { border-color: #06b6d4; color: #06b6d4; }
    body[data-fond="clair"] button { border-color: rgba(0, 0, 0, .12); background: rgba(0, 0, 0, .04); }

    #erreur {
      display: none;
      max-width: 520px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(239, 68, 68, .4);
      background: rgba(239, 68, 68, .08);
      color: #fca5a5;
    }
  </style>
</head>
<body data-fond="damier">
  <h1>Wally 3D — maquette</h1>
  <p class="sous">
    Rien n'est remplacé : l'avatar de gauche est la maquette 3D, celui de droite
    est la vidéo actuellement diffusée sur l'overlay. Le damier montre le détourage.
  </p>

  <div id="erreur"></div>

  <div class="scene">
    <div class="vignette">
      <div class="cadre"><canvas id="canvas-wally"></canvas></div>
      <span class="etiquette">maquette 3D — temps réel</span>
      <span class="etiquette" id="mesures">…</span>
    </div>
    <div class="vignette">
      <div class="cadre">
        <video src="/static/avatar/wally.webm" autoplay loop muted playsinline></video>
      </div>
      <span class="etiquette">avatar actuel — wally.webm</span>
    </div>
  </div>

  <div class="controles">
    <button data-fond="damier" aria-pressed="true">Damier</button>
    <button data-fond="sombre">Fond sombre</button>
    <button data-fond="clair">Fond clair</button>
    <button data-fond="jeu">Fond « jeu »</button>
  </div>

  <script type="module">
    import { creerWally } from "/static/avatar3d.js";

    const canvas = document.getElementById("canvas-wally");
    const erreur = document.getElementById("erreur");

    /* Repli : le rendu 3D n'est pas garanti (pilote, WebGL absent, contexte
       perdu). Sur l'overlay ce sera obligatoire — un trou noir en plein live
       est pire que pas d'avatar. La maquette le fait déjà, pour éprouver le
       chemin de secours autant que le chemin nominal. */
    function replier(raison) {
      const cadre = canvas.parentElement;
      if (cadre.querySelector("video")) return;
      canvas.remove();
      const video = document.createElement("video");
      Object.assign(video, { src: "/static/avatar/wally.webm", autoplay: true, loop: true, muted: true, playsInline: true });
      cadre.appendChild(video);
      console.warn("Repli sur wally.webm :", raison);
    }

    try {
      const wally = creerWally(canvas, replier);
      const cadre = canvas.parentElement;
      const ajuster = () => wally.redimensionner(cadre.clientWidth, cadre.clientHeight);
      new ResizeObserver(ajuster).observe(cadre);
      ajuster();

      /* La flamme est tracée au rayon, donc son coût est proportionnel aux
         PIXELS : c'est le poste qui décidera si l'avatar tient dans OBS à côté
         d'un jeu. Autant le lire ici plutôt que de le supposer. */
      const mesures = document.getElementById("mesures");
      setInterval(() => {
        const ms = wally.mesures().ms;
        const ips = ms > 0 ? Math.round(1000 / ms) : 0;
        mesures.textContent = `${ms.toFixed(1)} ms/image · ${ips} images/s`;
      }, 500);
    } catch (e) {
      /* La maquette DIT ce qui a échoué — c'est sa raison d'être — mais elle
         replie quand même sur la vidéo : un cadre vide ne prouve rien, et le
         chemin de secours doit être éprouvé ici avant de l'être en live. */
      erreur.style.display = "block";
      erreur.textContent = "Rendu 3D indisponible : " + e.message;
      console.error(e);
      replier(e.message);
    }

    const choisirFond = (nom) => {
      document.body.dataset.fond = nom;
      document.querySelectorAll(".controles button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.fond === nom)));
    };

    for (const bouton of document.querySelectorAll(".controles button")) {
      bouton.addEventListener("click", () => choisirFond(bouton.dataset.fond));
    }

    /* `?fond=clair` : un fond se choisit aussi par l'URL, sinon la page n'est
       vérifiable qu'à la main — or c'est sur fond CLAIR qu'un halo de détourage
       se voit, et c'est le cas qui compte pour une source OBS. */
    const voulu = new URLSearchParams(location.search).get("fond");
    if (voulu && document.querySelector(`.controles button[data-fond="${CSS.escape(voulu)}"]`)) {
      choisirFond(voulu);
    }
  </script>
</body>
</html>
