<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Wally — rotateur de memes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent; overflow: hidden;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* Passe-partout sombre. La plupart des memes sont sur fond blanc : sur un
     overlay noir, ça fait une dalle plus lumineuse que le reste de l'écran.
     Le liseré sombre casse le contact entre ce blanc et la bordure orange. */
  #cadre {
    padding: 14px;
    background: rgba(8, 6, 5, 0.94);
    border: 3px solid #ff7a2f;
    border-radius: 16px;
    box-shadow:
      0 0 24px rgba(255, 122, 47, 0.6),
      inset 0 0 30px rgba(0, 0, 0, 0.9),
      0 18px 45px rgba(0, 0, 0, 0.8);
    opacity: 0;
    line-height: 0;
    /* Rien ne doit dépasser des coins : sans ça, l'angle droit du média
       réapparaît derrière l'arrondi du cadre. */
    overflow: hidden;
  }

  /* Borné en largeur ET en hauteur, jamais agrandi : c'est le cadre qui épouse
     l'image. En unités relatives à la source OBS et non en pixels, pour
     survivre à un redimensionnement de celle-ci. */
  #cadre img, #cadre video {
    display: block;
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 40px);
    width: auto; height: auto;
    border-radius: 6px;
  }

  /* `#cadre .absent` et non `.absent` : la règle au-dessus est portée par un
     ID (`#cadre video`), qui l'emporterait sur une simple classe. Sans ce
     sélecteur, la balise vidéo vide restait affichée et ajoutait ses 150 px de
     hauteur par défaut sous chaque image. */
  #cadre .absent { display: none; }
</style>
</head>
<body>
<div id="cadre">
  <img id="media" alt="">
  <video id="video" class="absent" playsinline></video>
</div>

<script>
(function () {
  const cadre = document.getElementById('cadre');
  const params = new URLSearchParams(location.search);
  /** Lit un réglage numérique de l'URL.
   *
   *  `params.has` d'abord, et non `Number(...)` seul : `Number(null)` vaut 0,
   *  donc un paramètre ABSENT passerait pour un zéro explicite dès qu'on
   *  autorise le zéro. Le minimum est donc porté par l'appelant, pas deviné.
   */
  const nombre = function (cle, defaut, minimum) {
    if (!params.has(cle)) return defaut;
    const v = Number(params.get(cle));
    return Number.isFinite(v) && v >= minimum ? v : defaut;
  };

  // `pause=0` est une valeur légitime : elle enchaîne les memes sans temps
  // mort, le glitch de sortie de l'un touchant celui d'entrée du suivant.
  const DUREE = nombre('duree', 9, 0.05) * 1000;
  const PAUSE = nombre('pause', 5, 0) * 1000;
  const ORDRE = params.get('ordre') === 'dossier' ? 'dossier' : 'hasard';
  const SACCADE = nombre('saccade', 33, 1);   // ms par état de glitch
  const ETATS = 7;                          // états par rafale

  const FILTRES = [
    'invert(1) hue-rotate(90deg)',
    'hue-rotate(200deg) saturate(6)',
    'brightness(2.6) saturate(0)',
    'drop-shadow(7px 0 0 rgba(255,0,64,.9)) drop-shadow(-7px 0 0 rgba(0,225,255,.9))',
    'invert(1) saturate(4)',
    'hue-rotate(-70deg) saturate(5) brightness(1.4)',
  ];

  const hasard = function (min, max) { return min + Math.random() * (max - min); };
  const parmi = function (liste) { return liste[Math.floor(Math.random() * liste.length)]; };

  /** Un état de glitch : une bande visible, un décalage, une couleur qui dérive.
   *
   *  Tiré au sort à chaque passage plutôt qu'écrit en @keyframes : un glitch
   *  qui rejoue la même chorégraphie toutes les quinze secondes se lit comme
   *  une boucle et devient mécanique. Le coût est identique — ce sont les mêmes
   *  propriétés qui bougent.
   */
  function etatAuHasard() {
    const haut = hasard(0, 70);
    const bas = hasard(0, 100 - haut - 12);
    return {
      clipPath: 'inset(' + haut.toFixed(0) + '% 0 ' + bas.toFixed(0) + '% 0)',
      transform: 'translateX(' + hasard(-26, 26).toFixed(0) + 'px) scaleY('
                 + hasard(0.94, 1.07).toFixed(2) + ')',
      filter: parmi(FILTRES),
      opacity: Math.random() < 0.2 ? '0.45' : '1',
    };
  }

  // `round 16px` et non `inset(0 0 0 0)` nu : un clip rectangulaire laisse
  // l'angle droit du contenu réapparaître derrière les coins arrondis du cadre.
  // Le rayon doit suivre celui du CSS. Les états de glitch, eux, coupent à
  // angles droits — c'est l'effet recherché.
  const RAYON = '16px';
  const NET = { clipPath: 'inset(0 0 0 0 round ' + RAYON + ')', transform: 'none', filter: 'none', opacity: '1' };
  const ETEINT = { clipPath: 'inset(0 0 100% 0 round ' + RAYON + ')', transform: 'none', filter: 'none', opacity: '0' };

  function appliquer(etat) {
    cadre.style.clipPath = etat.clipPath;
    cadre.style.transform = etat.transform;
    cadre.style.filter = etat.filter;
    cadre.style.opacity = etat.opacity;
  }

  function rafale() {
    return new Promise(function (fini) {
      let n = 0;
      (function saccade() {
        if (n >= ETATS) { fini(); return; }
        appliquer(etatAuHasard());
        n += 1;
        setTimeout(saccade, SACCADE);
      })();
    });
  }

  let medias = [];
  let dernier = null;
  let rang = 0;
  let depuisRelecture = 0;

  async function charger() {
    // Une liste vide n'écrase jamais une liste qui marchait : le bot peut être
    // en train de redémarrer, la source doit continuer de tourner.
    try {
      const r = await fetch('/api/public/rotation', { cache: 'no-store' });
      const data = await r.json();
      if (Array.isArray(data.medias) && data.medias.length) medias = data.medias;
    } catch (e) { /* on garde la liste précédente */ }
  }

  function tirer() {
    if (ORDRE === 'dossier') {
      const m = medias[rang % medias.length];
      rang += 1;
      return m;
    }
    // Deux fois le même d'affilée passerait pour un bug d'affichage.
    const pool = medias.filter(function (m) { return m.nom !== dernier; });
    const choix = pool.length ? pool : medias;
    return choix[Math.floor(Math.random() * choix.length)];
  }

  function url(media) {
    return '/api/public/meme/' + encodeURIComponent(media.nom);
  }

  /** Charge le média et attend ses dimensions AVANT de l'afficher.
   *  Sans ça, le cadre naîtrait à la taille de l'ancien média puis grandirait
   *  d'un coup quand le nouveau arrive : le saut de format serait visible. */
  function precharger(media) {
    return new Promise(function (resolve, reject) {
      if (media.genre === 'video') {
        const v = document.getElementById('video');
        v.onloadedmetadata = function () { resolve(); };
        v.onerror = function () { reject(new Error('vidéo illisible : ' + media.nom)); };
        v.src = url(media);
        v.load();
        return;
      }
      const img = new Image();
      img.onload = function () { resolve(); };
      img.onerror = function () { reject(new Error('média illisible : ' + media.nom)); };
      img.src = url(media);
    });
  }

  /** Joue la vidéo et rend la main à la fin.
   *
   *  Trois façons de ne jamais rendre la main, trois parades :
   *  - le navigateur refuse la lecture audio automatique → seconde tentative
   *    en muet, puis abandon ;
   *  - le fichier est tronqué et `ended` n'arrive jamais → minuteur de secours ;
   *  - la lecture cale → le même minuteur.
   *  Sans elles, la source resterait figée sur cette vidéo pour tout le live.
   */
  function jouerVideo() {
    const v = document.getElementById('video');
    return new Promise(function (fini) {
      let rendu = false;
      const rendreLaMain = function () {
        if (rendu) return;
        rendu = true;
        clearTimeout(secours);
        v.onended = null;
        fini();
      };

      const limite = Number.isFinite(v.duration) && v.duration > 0
        ? (v.duration + 5) * 1000
        : 60000;
      const secours = setTimeout(rendreLaMain, limite);

      v.onended = rendreLaMain;
      v.muted = false;
      v.currentTime = 0;
      v.play().catch(function () {
        // Chrome bloque la lecture audio automatique tant qu'OBS n'a pas
        // autorisé la source. Muet vaut mieux que rien.
        v.muted = true;
        v.play().catch(rendreLaMain);
      });
    });
  }

  async function tour() {
    // Le bloc est éteint AVANT de changer de média : le cadre se redimensionne
    // pendant qu'il est invisible, sinon on le verrait sauter d'un format à
    // l'autre.
    appliquer(ETEINT);

    if (!medias.length) {
      await charger();
      setTimeout(tour, medias.length ? 0 : 10000);
      return;
    }

    const media = tirer();
    dernier = media.nom;

    // Tous les N affichages, où N est la taille de la liste : un meme déposé
    // pendant le live entre dans la rotation sans toucher à OBS.
    depuisRelecture += 1;
    if (depuisRelecture >= medias.length) { depuisRelecture = 0; charger(); }

    try {
      await precharger(media);
    } catch (e) {
      // Un fichier qui ne charge pas sort de la liste pour la session : sans
      // ça il reviendrait à chaque tour et laisserait un trou à l'écran. C'est
      // exactement le défaut qui a fait abandonner StreamElements.
      medias = medias.filter(function (m) { return m.nom !== media.nom; });
      setTimeout(tour, 0);
      return;
    }

    const img = document.getElementById('media');
    const video = document.getElementById('video');
    const estVideo = media.genre === 'video';
    img.classList.toggle('absent', estVideo);
    video.classList.toggle('absent', !estVideo);
    if (!estVideo) img.src = url(media);

    await rafale();
    appliquer(NET);

    const sortir = async function () {
      await rafale();
      appliquer(ETEINT);
      if (estVideo) video.pause();
      setTimeout(tour, PAUSE);
    };

    // Une vidéo dure ce qu'elle dure ; une image, le temps réglé.
    if (estVideo) {
      await jouerVideo();
      sortir();
    } else {
      setTimeout(sortir, DUREE);
    }
  }

  charger().then(tour);
})();
</script>
</body>
</html>
