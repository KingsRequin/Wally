<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wally Dashboard</title>
  <script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- animate.css — l'APERÇU du sélecteur d'animation du panneau de mise en
       scène. Sans cette feuille, `animate__zoomInDown` ne désigne rien et la
       vignette resterait immobile : on choisirait une animation sur son nom
       seul, ce que le sélecteur existe précisément pour éviter. La même
       feuille est servie à l'overlay, qui les JOUE en direct.
       Déclarée AVANT `style.css`, qui doit l'emporter. -->
  <link rel="stylesheet" href="/static/animate.min.css">
  <link rel="stylesheet" href="/static/style.css?v=21">
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23888888' stroke='white' stroke-width='2'/></svg>">
</head>
<body>

<div class="app-wrapper">

  <!-- Sidebar — groupée par thème, deux niveaux de navigation au maximum.
       Pas d'icône ici : la direction retenue est en texte seul, les libellés
       portés par des en-têtes de groupe en monospace. Les SVG de l'ancienne
       sidebar sont réservés à la barre du bas mobile.

       Chaque entrée est un VRAI lien vers son hash, pas un `onclick` : c'est
       ce qui rend l'URL partageable, le rechargement fidèle et le clic-milieu
       possible. Le routeur écoute `hashchange`. -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">W <span class="sidebar-logo-sub">Admin</span></div>

    <nav class="sidebar-nav" id="nav-admin">

      <a class="sidebar-item" data-route="cockpit" href="#/cockpit">
        <span>Cockpit</span>
      </a>

      <div class="sidebar-group">Cerveau</div>
      <a class="sidebar-item" data-route="cerveau/personnes" href="#/cerveau/personnes">
        <span>Personnes</span>
        <span id="links-badge" class="sidebar-badge" style="display:none">0</span>
      </a>
      <a class="sidebar-item" data-route="cerveau/memoire" href="#/cerveau/memoire">
        <span>Mémoire commune</span>
      </a>
      <a class="sidebar-item" data-route="cerveau/personnalite" href="#/cerveau/personnalite">
        <span>Personnalité</span>
      </a>
      <a class="sidebar-item" data-route="cerveau/modeles" href="#/cerveau/modeles">
        <span>Modèles &amp; coûts</span>
      </a>

      <div class="sidebar-group">Live</div>
      <a class="sidebar-item" data-route="live/scene" href="#/live/scene">
        <span>Scène &amp; overlays</span>
      </a>
      <a class="sidebar-item" data-route="live/voix" href="#/live/voix">
        <span>Voix</span>
      </a>
      <a class="sidebar-item" data-route="live/medias" href="#/live/medias">
        <span>Médias &amp; sons</span>
      </a>
      <a class="sidebar-item" data-route="live/automatisations" href="#/live/automatisations">
        <span>Automatisations</span>
      </a>

      <div class="sidebar-group">Système</div>
      <a class="sidebar-item" data-route="systeme/journal" href="#/systeme/journal">
        <span>Journal</span>
      </a>
      <a class="sidebar-item" data-route="systeme/connexions" href="#/systeme/connexions">
        <span>Connexions</span>
      </a>

    </nav>

    <div class="sidebar-spacer"></div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Barre du haut — 48 px, état des adaptateurs à gauche, build et actions
         à droite. Collante : elle ne défile pas avec la page. -->
    <div class="control-bar" id="control-bar" style="display:none">
      <div class="control-bar-group">
        <div class="control-bar-indicator">
          <span class="control-bar-dot" id="discord-dot"></span>
          <span class="control-bar-label">Discord</span>
          <button class="control-bar-btn" id="discord-toggle-btn" onclick="toggleBotAdapter('discord')">Stop</button>
        </div>
        <div class="control-bar-indicator">
          <span class="control-bar-dot" id="twitch-dot"></span>
          <span class="control-bar-label">Twitch</span>
          <button class="control-bar-btn" id="twitch-toggle-btn" onclick="toggleBotAdapter('twitch')">Stop</button>
        </div>
      </div>
      <div class="control-bar-spacer"></div>
      <div class="control-bar-group" id="update-group" style="display:none">
        <button class="control-bar-btn update" id="update-available-btn" onclick="triggerSelfUpdate()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v6m0 0l3-3m-3 3L9 5M12 22v-6m0 0l3 3m-3-3l-3 3M2 12h6m0 0L5 9m3 3l-3 3M22 12h-6m0 0l3-3m-3 3l3 3"/></svg>
          Update dispo
        </button>
      </div>
      <!-- Les actions de la page courante — l'URL OBS pour la Scène, par
           exemple. Vidées par le routeur à chaque changement de page : une
           page ne doit jamais hériter des boutons de la précédente. -->
      <div class="control-bar-page" id="control-bar-page"></div>
      <span id="version-badge" class="control-bar-build"></span>
      <button class="control-bar-btn restart" id="restart-btn" onclick="restartContainer()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Restart
      </button>
    </div>

    <div class="page-body">
      <div class="page-main">

        <!-- Titre de page — écrit par le routeur, jamais à la main. -->
        <header class="page-head" id="page-head" hidden>
          <h1 class="page-title" id="page-title"></h1>
          <p class="page-sub" id="page-sub"></p>
          <!-- Les pages du thème courant, en rangée scrollable. Mobile seul. -->
          <div class="theme-puces" id="theme-puces"></div>
          <!-- Les commandes de la page, à droite du titre : le sélecteur de
               scène, par exemple. Vidées par le routeur, comme le sommaire. -->
          <div class="page-actions" id="page-actions"></div>
        </header>


        <!-- COCKPIT — l'écran d'arrivée. -->
        <div class="tab-content active" id="tab-admin-cockpit"></div>

        <!-- CERVEAU › PERSONNES — l'annuaire, et la fiche d'une personne.
             Deux panneaux distincts : la liste garde son état (recherche,
             filtres, position de défilement) pendant qu'on ouvre une fiche. -->
        <div class="tab-content" id="tab-admin-personnes"></div>
        <div class="tab-content" id="tab-admin-personne"></div>

        <!-- ADMIN MEMOIRE TAB -->
        <div class="tab-content" id="tab-admin-memoire"></div>

        <!-- ADMIN ACTIONS TAB -->
        <div class="tab-content" id="tab-admin-actions"></div>

        <!-- CERVEAU › PERSONNALITÉ et MODÈLES & COÛTS -->
        <div class="tab-content" id="tab-admin-personnalite"></div>
        <div class="tab-content" id="tab-admin-modeles"></div>

        <!-- LIVE › MÉDIAS & SONS, VOIX -->
        <div class="tab-content" id="tab-admin-medias"></div>
        <div class="tab-content" id="tab-admin-voix"></div>

        <!-- ADMIN MISE EN SCENE TAB (overlay_admin.js le remplit entièrement) -->
        <div class="tab-content" id="tab-admin-scene"></div>

        <!-- SYSTÈME › JOURNAL — page à part entière depuis la refonte : les
             trois barres d'onglets qu'elle portait sont devenues des filtres. -->
        <div class="tab-content" id="tab-admin-journal"></div>

        <!-- SYSTÈME › CONNEXIONS -->
        <div class="tab-content" id="tab-admin-connexions"></div>

      </div>

      <!-- Sommaire d'ancres — rempli par la page qui en a un, vidé et masqué
           par le routeur à chaque changement de route. Une page sans sommaire
           ne doit pas hériter de celui de la précédente. -->
      <aside class="page-rail" id="page-rail" hidden></aside>
    </div>

  </main>

  <!-- Barre du bas — mobile seulement (masquée au-dessus de 780 px).
       Quatre destinations, pas onze : sur 390 px de large, une liste de onze
       entrées ne se lit pas. Les pages d'un thème deviennent une rangée de
       puces sous le titre (`#theme-puces`), remplie par le routeur.

       Ce sont les icônes de l'ancienne sidebar, que la refonte a retirées du
       bureau : elles retrouvent ici leur seul usage justifié — un libellé de
       10 px ne suffit pas à distinguer quatre cibles au pouce. -->
  <nav class="barre-bas" id="barre-bas" aria-label="Navigation mobile">
    <a class="barre-bas-item" data-theme="cockpit" href="#/cockpit">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      <span>Cockpit</span>
    </a>
    <a class="barre-bas-item" data-theme="cerveau" href="#/cerveau/personnes">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>
      <span>Cerveau</span>
    </a>
    <a class="barre-bas-item" data-theme="live" href="#/live/scene">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 21h8M12 17v4"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h4v5h-4z"/></svg>
      <span>Live</span>
    </a>
    <a class="barre-bas-item" data-theme="systeme" href="#/systeme/journal">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Système</span>
      <span class="barre-bas-pastille" id="badge-systeme" hidden></span>
    </a>
  </nav>
</div>

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal" role="dialog" aria-modal="true" aria-label="Connexion admin">
  <div class="modal">
    <h2>ACCES ADMIN</h2>
    <div class="field-group">
      <label class="field-label" for="token-input">Dashboard Token</label>
      <input type="password" id="token-input" placeholder="Entrer le token..." onkeydown="if(event.key==='Enter') submitToken()">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-success" onclick="submitToken()">VALIDER</button>
      <button class="btn" onclick="hideAuthModal()">ANNULER</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container" aria-live="assertive"></div>

<script src="/static/app.js?v=18"></script>
<!-- La mise en scène de l'overlay. `overlay_layout.js` d'abord : il porte les
     neuf ancrages, dont `overlay_admin.js` se sert pour placer ses rectangles. -->
<script src="/static/overlay_layout.js?v=2"></script>
<script src="/static/overlay_admin.js?v=11"></script>
</body>
</html>
