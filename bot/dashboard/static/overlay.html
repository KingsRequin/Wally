<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wally Overlay</title>
  <style>
    /* Overlay OBS — destiné aux VIEWERS, jamais au streamer (il ne le voit pas
       pendant qu'il joue). Fond transparent, tout est en position fixe. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Encre et papier : les deux bulles sont dessinées comme une planche de BD —
       aplat clair, trait sombre épais. Le contraste tient sur n'importe quel
       gameplay, clair ou sombre, sans avoir à rendre quoi que ce soit
       translucide (une bulle translucide laisse voir ses propres raccords). */
    :root {
      --ink:   #14121c;
      --paper: #f7f3e9;
    }

    body {
      background: transparent;
      overflow: hidden;
      height: 100vh;
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      /* Empêche OBS de sélectionner/afficher un curseur sur la source. */
      user-select: none;
      cursor: none;
    }

    #stage {
      position: absolute;
      left: 0;
      bottom: 0;
      /* Garde-fou : quoi qu'il arrive, le décor reste dans la source. */
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px;
      transition: opacity .4s ease;
    }
    #stage.hidden { opacity: 0; }

    /* ── Avatar ─────────────────────────────────────────────────────────── */
    #avatar-slot {
      position: relative;
      width: 200px;
      height: 200px;
      flex: 0 0 auto;
    }
    /* Vise l'enfant du slot, quel qu'il soit (video, img…) : remplacer l'avatar
       ne demande pas de retoucher ce fichier. */
    #avatar-slot > * {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* transform/opacity uniquement : composé par le GPU, sans repaint. */
      transition: transform .25s ease;
      transform-origin: bottom center;
    }
    /* Réaction ponctuelle (raid, série de subs) — le personnage s'emballe. */
    #avatar-slot.reacting > * { animation: flare .9s ease-out; }
    @keyframes flare {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.18) rotate(-3deg); }
      60%  { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1); }
    }

    /* ── Ancrage à droite (défaut) ──────────────────────────────────────
       La source est posée sur le bord DROIT de l'écran : tout part donc de la
       droite, sinon les bulles s'étalent vers l'extérieur et sortent du cadre.
       L'avatar est retourné pour continuer de faire face au contenu.
       `?side=left` rétablit l'ancrage à gauche. */
    body[data-side="right"] #stage {
      left: auto;
      right: 0;
      flex-direction: row-reverse;
    }
    /* Le miroir porte sur le SLOT, pas sur l'avatar : l'animation de réaction
       (.reacting) écrit sur `transform` et effacerait un scaleX posé là. */
    body[data-side="right"] #avatar-slot { transform: scaleX(-1); }
    body[data-side="right"] #widgets { left: auto; right: 12px; }
    body[data-side="right"] .widget { justify-content: flex-end; }

    /* Pointes de bulle : elles visent l'avatar, donc elles changent de côté. */
    body[data-side="right"] #bubble.speech::after {
      left: auto;
      right: -44px;
      transform: scaleX(-1);
    }
    body[data-side="right"] #bubble.thought::after  { left: auto; right: 30px; }
    body[data-side="right"] #bubble.thought::before { left: auto; right: 12px; }

    /* ── Bulle ──────────────────────────────────────────────────────────── */
    #bubble {
      position: relative;
      /* La largeur s'adapte à la source OBS au lieu de la supposer assez grande :
         234px = avatar (200) + gap (10) + padding (24). Sur une source étroite,
         la bulle rétrécit au lieu de sortir du cadre. */
      max-width: min(300px, calc(100vw - 234px));
      /* Remontée à hauteur de tête : la bulle flotte en haut de la mascotte
         plutôt qu'à ses pieds. */
      margin-bottom: 132px;
      padding: 20px 30px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      /* Lettrage de BD : centré dans la bulle, jamais aligné à gauche. */
      text-align: center;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      /* Ovale plutôt que rectangle arrondi : les deux extrémités sont des arcs
         entiers (rayon horizontal = 50 %), et les flancs gardent un segment
         droit (rayon vertical = 26 % < 50 %) sur lequel la queue vient se
         greffer quelle que soit la hauteur du texte. */
      border-radius: 50% / 26%;
      /* L'ombre porte sur la silhouette réelle, queue comprise — une box-shadow
         suivrait la boîte et laisserait la queue à plat. */
      filter: drop-shadow(0 3px 7px rgba(0, 0, 0, .45));
      opacity: 0;
      transform: translateY(10px) scale(.94);
      /* Dépassement léger à l'arrivée (le ressort d'une bulle qui « pop »),
         retrait plus sec au départ : l'œil suit l'apparition, pas la sortie. */
      transition: opacity .2s ease, transform .34s cubic-bezier(.22, 1.4, .4, 1);
      pointer-events: none;
    }
    #bubble.visible { opacity: 1; transform: translateY(0) scale(1); }

    /* Le texte porte seul le garde-fou anti-débordement : une réplique trop
       longue est coupée net plutôt que de pousser le décor hors de l'écran.
       Il est sur un élément INTERNE, sinon le `overflow: hidden` rognerait la
       queue de la bulle, qui déborde volontairement. */
    #bubble-text {
      max-height: calc(100vh - 200px);
      overflow: hidden;
    }

    /* Queue de la bulle de dialogue : une corne courbe et effilée, pas un
       triangle. Taille fixe (jamais étirée), greffée sur le flanc de la bulle à
       mi-hauteur — là où l'ovale offre son segment vertical. Le SVG déborde de
       4 px sur la bulle : son aplat recouvre le trait à cet endroit et le
       raccord disparaît. */
    #bubble.speech::after {
      content: "";
      position: absolute;
      left: -44px;
      top: 54%;
      margin-top: -12px;
      width: 48px;
      height: 48px;
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2048%2048%27%3E%3Cpath%20d=%27M48%202C32%208%2018%2022%202%2045C20%2032%2032%2027%2048%2023Z%27%20fill=%27%23f7f3e9%27/%3E%3Cpath%20d=%27M44%202C32%208%2018%2022%202%2045C20%2032%2032%2027%2044%2023%27%20fill=%27none%27%20stroke=%27%2314121c%27%20stroke-width=%273%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E");
      background-repeat: no-repeat;
    }

    /* Bulle de pensée : un vrai nuage de BD, pour qu'on ne la confonde JAMAIS
       avec une réplique. */
    #bubble.thought {
      font-style: italic;
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 26px 38px;
      /* Silhouette vectorielle plutôt que des gradients : en pourcentages,
         les cercles s'aplatissaient avec la boîte et le nuage redevenait un
         rectangle. Le SVG s'étire (preserveAspectRatio=none) en gardant ses
         bosses, quelle que soit la longueur du texte.

         Le contour est obtenu en dessinant la silhouette DEUX fois : une passe
         d'encre élargie par un trait épais, puis la même forme en papier
         par-dessus. Les chevauchements entre bosses disparaissent — chaque
         passe est d'une seule couleur OPAQUE. Des aplats translucides, eux,
         laissaient voir le contour de chaque cercle à travers ses voisins.
         `non-scaling-stroke` garde le trait à 3 px même quand le SVG est étiré
         en largeur : sans lui, une pensée courte aurait un trait deux fois plus
         fin qu'une longue. */
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20200%20100%27%20preserveAspectRatio=%27none%27%3E%3Cdefs%3E%3Cg%20id=%27c%27%3E%3Crect%20x=%2716%27%20y=%2730%27%20width=%27168%27%20height=%2742%27%20rx=%2720%27%20vector-effect=%27non-scaling-stroke%27/%3E%3Cellipse%20cx=%2746%27%20cy=%2732%27%20rx=%2730%27%20ry=%2724%27%20vector-effect=%27non-scaling-stroke%27/%3E%3Cellipse%20cx=%27100%27%20cy=%2728%27%20rx=%2734%27%20ry=%2721%27%20vector-effect=%27non-scaling-stroke%27/%3E%3Cellipse%20cx=%27154%27%20cy=%2733%27%20rx=%2731%27%20ry=%2723%27%20vector-effect=%27non-scaling-stroke%27/%3E%3Cellipse%20cx=%2752%27%20cy=%2770%27%20rx=%2732%27%20ry=%2722%27%20vector-effect=%27non-scaling-stroke%27/%3E%3Cellipse%20cx=%27108%27%20cy=%2773%27%20rx=%2736%27%20ry=%2720%27%20vector-effect=%27non-scaling-stroke%27/%3E%3Cellipse%20cx=%27158%27%20cy=%2768%27%20rx=%2730%27%20ry=%2723%27%20vector-effect=%27non-scaling-stroke%27/%3E%3C/g%3E%3C/defs%3E%3Cuse%20href=%27%23c%27%20fill=%27%2314121c%27%20stroke=%27%2314121c%27%20stroke-width=%276%27%20stroke-linejoin=%27round%27/%3E%3Cuse%20href=%27%23c%27%20fill=%27%23f7f3e9%27/%3E%3C/svg%3E");
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    /* Les deux bulles satellites qui descendent vers l'avatar : la signature
       visuelle de la pensée en BD. Détachées du nuage, jamais superposées :
       deux contours qui se croisent trahissent le montage. */
    #bubble.thought::after,
    #bubble.thought::before {
      content: "";
      position: absolute;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 50%;
    }
    #bubble.thought::after  { left: 30px; bottom: -9px;  width: 17px; height: 17px; }
    #bubble.thought::before { left: 12px; bottom: -26px; width: 11px; height: 11px; }
    /* Ancrage à droite : les satellites descendent vers l'avatar, donc à droite. */
    body[data-side="right"] #bubble.thought::after  { left: auto; right: 26px; }
    body[data-side="right"] #bubble.thought::before { left: auto; right: 8px; }

    /* ── Trois points, pendant la génération ────────────────────────────── */
    .dots { display: inline-flex; gap: 5px; align-items: center; height: 10px; }
    .dots span {
      width: 7px; height: 7px;
      background: var(--ink);
      border-radius: 50%;
      animation: blink 1.25s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40%           { opacity: 1;   transform: translateY(-3px); }
    }

    /* ── Widgets (pile ou face, dé, uptime…) ────────────────────────────── */
    /* Les widgets occupent LA PLACE de l'avatar plutôt que de flotter au-dessus :
       superposés à son emplacement, ancrés sur le même bord bas, et l'avatar
       s'efface le temps de l'affichage. Largeur bornée à celle du slot pour ne
       jamais empiéter sur la bulle, qui commente le widget. */
    #widgets {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      top: 12px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      pointer-events: none;
      /* Perspective partagée : les enfants tournent en 3D réelle. */
      perspective: 600px;
    }
    /* La bulle s'efface pendant un widget : l'écran est petit, mieux vaut une
       chose lisible que deux qui se disputent la place. */
    body.widget-on #bubble { opacity: 0; transform: translateY(6px) scale(.97); }

    /* L'avatar cède la place, sans disparaître brutalement. */
    #avatar-slot > * { transition: transform .35s cubic-bezier(.3, .9, .3, 1), opacity .3s ease; }
    .widget {
      /* Un widget peut occuper toute la zone : l'avatar ET la bulle s'effacent
         pendant son affichage, il n'a personne à ménager. Chaque widget fixe
         ensuite sa propre largeur. */
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      opacity: 0;
      /* Le widget monte depuis la place de l'avatar, qui s'efface en même temps
         — un passage de relais plutôt qu'une superposition. */
      transform: translateY(16px) scale(.9);
      transition: opacity .28s ease, transform .42s cubic-bezier(.22, 1.3, .36, 1);
    }
    .widget.visible { opacity: 1; transform: translateY(0) scale(1); }

    /* L'avatar plonge légèrement en cédant la place, et remonte au retour. */
    body.widget-on #avatar-slot > * { opacity: 0; transform: translateY(10px) scale(.94); }

    /* Pièce — deux faces, rotation sur Y. Le classique CSS 3D : plus léger
       qu'un moteur, et composé par le GPU. */
    .coin {
      position: relative;
      width: 90px; height: 90px;
      transform-style: preserve-3d;
      animation: coin-flip 1.6s cubic-bezier(.3, .1, .2, 1) forwards;
    }
    .coin .face {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      backface-visibility: hidden;
      font-size: 30px; font-weight: 700; color: #3a2c00;
      background: radial-gradient(circle at 34% 30%, #ffe9a8, #e8b93d 55%, #b8860b);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5), inset 0 0 0 4px rgba(255,255,255,.25);
    }
    .coin .tails { transform: rotateY(180deg); }
    /* Le nombre de demi-tours décide de la face visible à l'arrêt :
       pair → pile, impair → face. Piloté par une variable, donc par Wally. */
    @keyframes coin-flip {
      0%   { transform: rotateY(0) translateY(0); }
      50%  { transform: rotateY(var(--half-turns-mid)) translateY(-55px); }
      100% { transform: rotateY(var(--half-turns)) translateY(0); }
    }

    /* Dé — cube à six faces. */
    .die {
      position: relative;
      width: 78px; height: 78px;
      transform-style: preserve-3d;
      animation: die-roll 1.5s cubic-bezier(.3, .1, .2, 1) forwards;
    }
    .die .side {
      position: absolute;
      width: 78px; height: 78px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; color: #1a1a1a;
      background: linear-gradient(150deg, #fdfdfd, #d8d8dc);
      border-radius: 12px;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .12);
    }
    .die .s1 { transform: rotateY(0deg)   translateZ(39px); }
    .die .s2 { transform: rotateY(90deg)  translateZ(39px); }
    .die .s3 { transform: rotateY(180deg) translateZ(39px); }
    .die .s4 { transform: rotateY(-90deg) translateZ(39px); }
    .die .s5 { transform: rotateX(90deg)  translateZ(39px); }
    .die .s6 { transform: rotateX(-90deg) translateZ(39px); }
    @keyframes die-roll {
      0%   { transform: rotateX(0) rotateY(0) translateY(0); }
      55%  { transform: rotateX(430deg) rotateY(380deg) translateY(-50px); }
      100% { transform: var(--final-rotation) translateY(0); }
    }

    /* Plusieurs dés : alignés, avec leur propre perspective pour que chaque
       cube tourne sur lui-même. */
    .dice-row { display: flex; gap: 14px; perspective: 600px; }

    /* Roue — secteurs colorés, rotation amortie, curseur fixe en haut. */
    /* 220px et non 150 : les intitulés sont maintenant écrits DANS les secteurs,
       et il faut pouvoir les lire par-dessus une image de jeu. */
    .wheel-box { position: relative; width: 220px; height: 220px; }
    /* Le conteneur que spin-wheel remplit de son canvas. Il se dimensionne sur
       lui, d'où la taille explicite plutôt qu'un `height: auto`. */
    .wheel-canvas {
      width: 100%; height: 100%;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, .55));
    }
    .wheel-box .pin {
      position: absolute; top: -9px; left: 50%;
      margin-left: -8px;
      border-width: 0 8px 15px 8px;
      border-style: solid;
      border-color: transparent transparent #fff transparent;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6));
      z-index: 2;
    }
    /* Le résultat ne s'affiche qu'à l'arrêt de la roue (classe posée par
       `onRest`) : le montrer plus tôt vendrait la mèche. */
    .wheel-box .label {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(.86);
      padding: 6px 13px;
      max-width: 150px;
      font-size: 15px; font-weight: 700; color: #fff; text-align: center;
      background: rgba(18, 18, 22, .92);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      transition: opacity .35s ease, transform .35s cubic-bezier(.22, 1.5, .4, 1);
    }
    .wheel-box .label.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Compte à rebours — anneau de tirets qui s'éteignent, temps au centre.
       Un simple chiffre ne disait pas d'un coup d'œil s'il restait beaucoup. */
    .countdown {
      position: relative;
      width: 220px; height: 220px;
      display: grid; place-items: center;
    }
    .cd-ring { width: 100%; height: 100%; display: block; }
    .cd-seg {
      stroke: #34343c;               /* éteint : le tiret reste visible */
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke .25s linear;
    }
    .cd-seg.on {
      stroke: var(--on, #f59e0b);
      filter: drop-shadow(0 0 3px var(--on, #f59e0b));
    }
    .cd-time {
      position: absolute;
      font-size: 38px; font-weight: 700; color: #fff;
      font-family: ui-monospace, "SFMono-Regular", "Consolas", monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .95);
    }
    .cd-time.tick { animation: tick .45s ease-out; }
    .countdown.done .cd-time { color: #ef4444; font-size: 30px; }
    @keyframes tick {
      0%   { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    /* Jauge d'objectif. */
    .gauge { width: 230px; }
    .gauge .cap {
      margin-bottom: 5px;
      font-size: 14px; font-weight: 600; color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .95);
    }
    .gauge .track {
      height: 17px;
      background: rgba(18, 18, 22, .85);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 10px;
      overflow: hidden;
    }
    .gauge .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #46c6ff, #9d7bff);
      border-radius: 10px;
      transition: width 1.1s cubic-bezier(.2, .7, .3, 1);
    }

    /* Message du chat épinglé — c'est Wally qui choisit lequel mérite l'écran. */
    .pinned {
      max-width: 290px;
      padding: 9px 13px;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-left: 3px solid #9d7bff;
      border-radius: 10px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .pinned .who { font-size: 12px; font-weight: 700; color: #b79cff; }
    .pinned .msg { font-size: 15px; line-height: 1.3; }

    /* Sondage — les viewers votent en tapant le numéro dans le chat. */
    .poll {
      width: 260px;
      padding: 10px 12px;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .poll .q {
      margin-bottom: 8px;
      font-size: 15px; font-weight: 700;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .poll .q .left { font-size: 13px; color: #b79cff; font-variant-numeric: tabular-nums; }
    /* Options : arrivée en cascade, ~60 ms d'écart — le regard descend la liste
       au lieu de la découvrir d'un bloc. */
    .poll .opt {
      margin-bottom: 6px;
      font-size: 13px;
      /* `backwards` (et NON `forwards`) : l'état initial s'applique pendant le
         délai, mais l'animation ne fige rien après coup — sinon elle écraserait
         l'estompage des perdants, qui est une simple propriété. */
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 60ms + 120ms);
    }
    @keyframes opt-in {
      from { opacity: 0; transform: translateX(10px); }
    }

    /* Le chiffre qui vient de bouger tressaille : on voit QUI prend le vote. */
    .poll .count { display: inline-block; }
    .poll .count.bump { animation: count-bump .32s ease-out; }
    @keyframes count-bump {
      0%   { transform: scale(1);   color: #fff; }
      35%  { transform: scale(1.22); color: #7dffb0; }
      100% { transform: scale(1);   color: #fff; }
    }

    /* Sablier : une seule animation linéaire, donc fluide en continu, là où le
       décompte en secondes saute d'un cran à la fois. */
    .poll .timer {
      height: 3px;
      margin: 2px 0 8px;
      background: rgba(255, 255, 255, .08);
      border-radius: 2px;
      overflow: hidden;
    }
    .poll .timer span {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, #b79cff, #46c6ff);
      animation: timer-drain linear forwards;
      animation-duration: var(--dur, 0s);
    }
    @keyframes timer-drain { to { transform: scaleX(0); } }
    /* Sondage clos : le sablier s'arrête net plutôt que de continuer à courir. */
    .poll.final .timer span { animation: none; transform: scaleX(0); }

    .poll .opt { margin-bottom: 6px; font-size: 13px; }
    .poll .opt .row { display: flex; justify-content: space-between; margin-bottom: 2px; }
    /* Gagnant, une fois le décompte terminé. Teinte + graisse plutôt qu'un cadre
       supplémentaire : plus lisible dans un widget de 250 px. */
    .poll .opt.win .row { color: #7dffb0; font-weight: 700; }
    .poll .opt.win .bar span { background: linear-gradient(90deg, #34d17f, #7dffb0); }
    /* À la clôture : le gagnant pulse une fois, les perdants reculent. */
    .poll.final .opt.win { animation: win-pop .5s cubic-bezier(.22, 1.5, .4, 1); }
    .poll.final .opt.lose { opacity: .45; transition: opacity .4s ease; }
    @keyframes win-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .poll .bar {
      height: 9px;
      background: rgba(255, 255, 255, .1);
      border-radius: 5px;
      overflow: hidden;
    }
    .poll .bar span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #46c6ff, #9d7bff);
      border-radius: 5px;
      transition: width .45s cubic-bezier(.3, .9, .3, 1), background .3s ease;
    }

    /* Classement des bavards — mécanique, donc sobre. */
    .talkers {
      width: 260px;
      padding: 11px 13px;
      background: rgba(18, 18, 22, .9);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .talkers-title {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
      color: rgba(255, 255, 255, .55); margin-bottom: 8px;
    }
    .talker {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 14px; margin-bottom: 5px;
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 90ms + 100ms);
    }
    .talker .pos { width: 22px; flex: 0 0 22px; }
    .talker .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .talker .n { font-weight: 700; font-variant-numeric: tabular-nums; color: #b79cff; }
    .talker.rank1 .who { color: #ffd479; font-weight: 700; }

    /* Clip — l'auteur compte autant que le titre : c'est lui qu'on récompense. */
    .clip {
      width: 300px;
      padding: 11px 13px;
      background: rgba(18, 18, 22, .9);
      border: 1px solid rgba(255, 255, 255, .14);
      border-left: 3px solid #46c6ff;
      border-radius: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      animation: wave-in .5s cubic-bezier(.22, 1.4, .4, 1);
    }
    .clip-head {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
      color: #46c6ff; margin-bottom: 5px;
    }
    .clip-title { font-size: 14px; line-height: 1.3; }
    .clip-author { margin-top: 5px; font-size: 12px; color: rgba(255, 255, 255, .55); }

    /* Clip joué : la vidéo prend la largeur utile de la source OBS (560 px),
       en 16:9. Le padding de la carte disparaît — un liseré autour d'une vidéo
       ne sert à rien et mange de la place. */
    .clip.playing {
      width: 540px;
      padding: 0;
      overflow: hidden;
      border-left-width: 1px;
    }
    /* Le conteneur réserve la place AVANT que l'iframe n'arrive (elle n'est
       montée qu'une fois le widget visible, cf. l'autoplay de Twitch) : sans
       hauteur fixe, le widget sauterait de 0 à 304 px sous les yeux. */
    .clip-frame {
      display: block;
      width: 540px;
      height: 304px;          /* 16:9 */
      background: #000;
      border: 0;
    }
    .clip-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    .clip-video {
      display: block;
      width: 540px;
      height: 304px;          /* 16:9 */
      background: #000;
      object-fit: contain;    /* un clip vertical n'est pas déformé */
    }
    /* Lecture impossible : on n'impose pas un cadre noir muet aux viewers. */
    .clip.clip-failed .clip-video { display: none; }
    .clip-credit {
      padding: 6px 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, .72);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Vague d'emote — elle surgit et repart : c'est un éclat, pas un panneau. */
    /* Raid — le nom de celui qui débarque, en grand. La carte doit tenir tête
       aux confettis qui traversent l'écran derrière elle, d'où le fond plus
       opaque et la bordure dorée. */
    .raid {
      padding: 14px 26px;
      background: rgba(18, 18, 22, .92);
      border: 1px solid rgba(255, 209, 102, .45);
      border-radius: 16px;
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      box-shadow: 0 4px 24px rgba(255, 209, 102, .16);
      animation: raid-in .55s cubic-bezier(.22, 1.5, .4, 1);
    }
    .raid-tag {
      font-size: 10.5px; font-weight: 800; letter-spacing: .22em;
      color: #ffd166; margin-bottom: 4px;
    }
    .raid-name {
      font-size: 25px; font-weight: 800; line-height: 1.15;
      /* Un pseudo long est déjà borné côté serveur, mais un mot sans espace
         peut encore déborder : il se coupe plutôt que d'élargir la carte. */
      max-width: 380px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .raid-count {
      margin-top: 5px; font-size: 12.5px;
      color: rgba(255, 255, 255, .62);
      font-variant-numeric: tabular-nums;
    }
    @keyframes raid-in {
      0%   { transform: scale(.72) translateY(14px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .wave {
      padding: 10px 18px;
      background: rgba(18, 18, 22, .85);
      border: 1px solid rgba(255, 176, 102, .35);
      border-radius: 14px;
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      animation: wave-in .5s cubic-bezier(.22, 1.5, .4, 1);
    }
    .wave-emote {
      font-size: 26px; font-weight: 800; color: #ffb066;
      letter-spacing: .02em;
    }
    .wave-label {
      margin-top: 2px; font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; color: rgba(255, 255, 255, .5);
    }
    @keyframes wave-in {
      0%   { transform: scale(.6) rotate(-4deg); opacity: 0; }
      60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* Citation — le guillemet et l'italique disent « quelqu'un a dit ça »
       avant même qu'on ait lu la phrase. */
    .quote {
      position: relative;
      width: 300px;
      padding: 14px 16px 12px;
      background: rgba(18, 18, 22, .9);
      border: 1px solid rgba(255, 255, 255, .14);
      border-left: 3px solid #ffb066;
      border-radius: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .quote-mark {
      position: absolute; top: -6px; left: 10px;
      font-size: 42px; line-height: 1;
      color: rgba(255, 176, 102, .35);
      font-family: Georgia, serif;
    }
    .quote-text {
      position: relative;
      font-size: 15px; line-height: 1.35; font-style: italic;
      /* La phrase se révèle d'un bloc, l'auteur juste après : on lit la
         réplique avant de savoir qui l'a dite, comme une chute. */
      animation: opt-in .4s cubic-bezier(.22, 1.3, .4, 1) backwards;
    }
    .quote-author {
      margin-top: 8px; font-size: 12px; text-align: right;
      color: rgba(255, 255, 255, .55);
      animation: opt-in .4s cubic-bezier(.22, 1.3, .4, 1) .45s backwards;
    }

    /* Pendu — le dessin porte l'information : on voit la partie se dégrader
       sans lire un compteur. */
    .hangman {
      display: flex; align-items: center; gap: 14px;
      width: 400px;
      padding: 12px 14px;
      background: rgba(18, 18, 22, .9);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 14px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .gallows { width: 96px; height: 104px; flex: 0 0 96px; }
    .gallows .post {
      stroke: rgba(255, 255, 255, .35); stroke-width: 4; stroke-linecap: round;
    }
    /* Chaque membre se TRACE : un trait qui surgit ne se remarque pas. */
    .gallows .part {
      stroke: #ff8a8a; stroke-width: 4; stroke-linecap: round; fill: none;
      stroke-dasharray: 120; stroke-dashoffset: 120;
      animation: draw-part .45s ease-out forwards;
      animation-delay: calc(var(--i, 0) * 40ms);
    }
    @keyframes draw-part { to { stroke-dashoffset: 0; } }

    .hangman-side { flex: 1; min-width: 0; }
    .hangman-hint {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
      color: rgba(255, 255, 255, .5); margin-bottom: 8px;
    }
    .hangman-word { display: flex; flex-wrap: wrap; gap: 5px; }
    .hangman-word .slot {
      width: 20px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700; text-transform: uppercase;
      border-bottom: 2px solid rgba(255, 255, 255, .3);
    }
    /* La lettre trouvée tombe en place au lieu d'apparaître. */
    .hangman-word .slot.filled {
      color: #7dffb0; border-bottom-color: rgba(125, 255, 176, .5);
      animation: slot-drop .32s cubic-bezier(.22, 1.4, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 35ms);
    }
    @keyframes slot-drop {
      from { opacity: 0; transform: translateY(-8px) scale(.8); }
    }
    .hangman-missed {
      margin-top: 8px; font-size: 12px; letter-spacing: .16em;
      color: #ff8a8a; text-decoration: line-through;
    }
    .hangman-help {
      margin-top: 8px; font-size: 11.5px; color: rgba(255, 255, 255, .45);
    }
    .hangman-verdict {
      margin-top: 8px; font-size: 14px; font-weight: 700;
      animation: win-pop .5s cubic-bezier(.22, 1.5, .4, 1);
    }
    .hangman.won  .hangman-verdict { color: #7dffb0; }
    .hangman.lost .hangman-verdict { color: #ff8a8a; }

    /* Chifoumi — le geste du vrai jeu : les mains secouent trois fois avant de
       se figer sur le coup joué. Sans ce battement, le résultat tombe sans
       suspense et le widget n'a plus d'intérêt. */
    .rps {
      width: 320px;
      padding: 12px 14px;
      background: rgba(18, 18, 22, .9);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 14px;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .rps-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: rgba(255, 255, 255, .6); margin-bottom: 10px;
    }
    .rps-hand { font-size: 38px; line-height: 1; }

    /* Duel */
    .rps-duel { display: flex; align-items: center; justify-content: center; gap: 18px; }
    .rps-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    /* Le pseudo peut être long : il se coupe plutôt que d'écarter les mains. */
    .rps-name {
      font-size: 11.5px; color: rgba(255, 255, 255, .6);
      max-width: 120px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .rps-vs {
      font-size: 13px; font-weight: 800; letter-spacing: .08em;
      color: rgba(255, 255, 255, .35);
      animation: vs-pulse 1.2s ease-in-out infinite;
    }
    @keyframes vs-pulse {
      0%, 100% { opacity: .35; transform: scale(1); }
      50%      { opacity: .8;  transform: scale(1.12); }
    }
    /* UNE seule animation, et c'est délibéré : la version d'avant en empilait
       deux (`rps-shake` puis `rps-land`) qui animaient toutes les deux
       `transform`. La dernière déclarée l'emporte, et comme `rps-land` était en
       `backwards`, son `scale(1.35)` s'appliquait pendant tout le délai — la
       secousse ne s'est donc JAMAIS vue, il ne restait qu'un zoom.
       Toute phase supplémentaire doit entrer dans ces keyframes, pas à côté. */
    .rps-duel .rps-hand {
      animation: rps-throw 1.25s cubic-bezier(.33, 0, .3, 1) backwards;
    }
    /* Les deux mains partent ENSEMBLE : au chifoumi on compte à deux. Les
       décaler donnait l'impression que l'un attendait de voir l'autre. */
    @keyframes rps-throw {
      /* Trois battements verticaux — le geste réel du jeu, « pierre, feuille,
         ciseaux » scandé en abaissant le poing. */
      0%, 23%, 45%, 68% { transform: translateY(0) scale(1); }
      11%, 34%, 57%     { transform: translateY(-18px) scale(1.04); }
      /* Le coup se pose : il tombe plus bas que sa place, puis remonte. */
      84%               { transform: translateY(3px) scale(1.2); }
      100%              { transform: translateY(0) scale(1); }
    }
    .rps-verdict {
      margin-top: 10px; font-size: 15px; font-weight: 700;
      /* Après les 1,25 s de lancer : le verdict ne doit pas tomber avant que
         les deux mains soient posées. */
      animation: opt-in .4s cubic-bezier(.22, 1.3, .4, 1) 1.35s backwards;
    }
    .rps.opponent .rps-verdict { color: #7dffb0; }
    .rps.wally    .rps-verdict { color: #ffb066; }
    .rps.draw     .rps-verdict { color: rgba(255, 255, 255, .6); }

    /* Meme de la communauté — l'image seule, sans légende : sa description est
       le contexte que Wally lit pour le commenter, pas un texte à afficher.
       Bornée en hauteur : une image verticale sortirait du cadre. */
    .meme {
      max-width: 100%;
      padding: 8px;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
    }
    .meme img {
      display: block;
      max-width: 380px;
      max-height: 260px;
      width: auto; height: auto;
      border-radius: 8px;
    }

    /* Planning des streams — ce sont des horaires : ils doivent être LISIBLES,
       pas devinés. À côté de l'avatar il ne reste que 326 px de large, où une
       image de 1280 tomberait à 308 px — un quart de sa taille. La carte prend
       donc toute la source le temps de son affichage ; l'avatar, effacé par
       `body.widget-on`, réapparaît juste après.

       Elle occupe le cadre par la TAILLE de son image, pas par un positionnement
       hors flux : `.widget` porte un `transform` (l'animation d'entrée), et un
       ancêtre transformé devient le bloc conteneur de tout `position: fixed`
       descendant. Le `fixed` initial ne visait donc pas la source mais un
       `.widget` sans hauteur — faute d'enfant dans le flux —, et la carte
       s'affichait en 16 x 16 px hors cadre : invisible. Même patron que `.meme`,
       aux dimensions près. */
    .planning {
      max-width: 100%;
      padding: 8px;
      background: rgba(18, 18, 22, .92);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
    }
    .planning img {
      display: block;
      /* Les 40 px retranchés : les 12 px d'`#widgets` de chaque côté, plus les
         8 px de padding de la carte. Mesuré sur la source réelle (526 x 296),
         l'image fait alors 455 px de large — contre 308 à côté de l'avatar. */
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 40px);
      width: auto; height: auto;
      border-radius: 8px;
    }

    /* Pari de Wally — ouverture, puis verdict. */
    .prediction {
      width: 280px;
      padding: 11px 13px;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-left: 3px solid #b79cff;
      border-radius: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .prediction.right { border-left-color: #7dffb0; }
    .prediction.wrong { border-left-color: #ff7d7d; }
    .pred-head {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
      color: rgba(255, 255, 255, .6); margin-bottom: 5px;
    }
    .prediction.right .pred-head { color: #7dffb0; font-weight: 700; }
    .prediction.wrong .pred-head { color: #ff7d7d; font-weight: 700; }
    .pred-bet { font-size: 14px; line-height: 1.3; }
    .prediction.wrong .pred-bet { text-decoration: line-through; opacity: .7; }
    .pred-score {
      margin-top: 7px; font-size: 12px; font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, .55);
    }

    /* Bingo du stream — liste plutôt que grille : à 200 px, une grille 3×3
       serait illisible. Les viewers regardent les cases se cocher. */
    .bingo {
      /* Vraie grille : la place le permet, l'avatar et la bulle s'effacent. */
      width: 420px;
      max-width: 100%;
      padding: 10px 12px;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .bingo-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: rgba(255, 255, 255, .6); margin-bottom: 8px;
    }
    .bingo.full .bingo-title {
      color: #7dffb0; font-weight: 800; letter-spacing: .12em;
      animation: win-pop .6s cubic-bezier(.22, 1.5, .4, 1);
    }
    /* 3 colonnes tant qu'il y a assez de cases, sinon autant que nécessaire. */
    .bingo .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .bingo.few .grid { grid-template-columns: repeat(2, 1fr); }
    .bingo .cell {
      display: flex; gap: 6px; align-items: flex-start;
      min-height: 46px; padding: 6px 7px;
      font-size: 12px; line-height: 1.2;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 8px;
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 55ms + 100ms);
    }
    .bingo .mark {
      width: 11px; flex: 0 0 11px; color: #7dffb0; font-weight: 700;
    }
    .bingo .cell.done {
      background: rgba(52, 209, 127, .12);
      border-color: rgba(125, 255, 176, .3);
    }
    .bingo .cell.done .txt {
      color: rgba(255, 255, 255, .55);
      text-decoration: line-through;
    }
    /* La case qu'on vient de cocher : sinon on ne voit pas ce qui a changé. */
    .bingo .cell.just .txt { color: #7dffb0; text-decoration: none; font-weight: 700; }
    .bingo .cell.just { animation: win-pop .5s cubic-bezier(.22, 1.5, .4, 1); }

    /* Stats d'un joueur — les chiffres viennent de l'API, pas du modèle. */
    .stats, .versus {
      width: 260px;
      padding: 10px 12px;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .stats .who {
      font-size: 14px; font-weight: 700; margin-bottom: 7px;
      color: #ffb066;
    }
    .stats .line {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 13px; margin-bottom: 4px;
      /* Même cascade que le sondage : les lignes se posent l'une après l'autre. */
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 70ms + 120ms);
    }
    /* Panneaux Apex — ils empruntent la carte de `.stats`, avec ce qu'il faut
       en plus : l'image du rang, l'état en jeu, un décompte qui tourne. */
    .apex .apex-rank-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .apex .apex-rank-img { width: 34px; height: 34px; object-fit: contain; }
    /* Un graphe n'est pas une liste de valeurs : la carte de `.stats` fait
       260 px, et la courbe s'y retrouvait dessinée à 234 px — 23 % de sa taille
       native, heures et durées illisibles à l'écran. Elle prend donc les 560 px
       de large utiles de la source OBS, bornés à ce que la source offre
       vraiment pour qu'une source étroite ne la fasse pas déborder. */
    .apex.apex-large { width: min(560px, calc(100vw - 24px)); }
    .apex .apex-progress-img { width: 100%; display: block; border-radius: 8px; }
    .apex .apex-rank-name { font-size: 15px; font-weight: 700; }
    .apex .apex-avatar {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
      float: right; margin: -26px 0 0 0;
    }
    .apex .apex-state {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: rgba(255, 255, 255, .6); margin-bottom: 8px;
    }
    .apex .apex-state.live { color: #7ee787; }
    .apex .apex-world { font-size: 11px; color: #ffb066; margin-left: 6px; }
    .apex .apex-timer {
      font-size: 11px; color: rgba(255, 255, 255, .55);
      margin-left: 6px; font-variant-numeric: tabular-nums;
    }
    .apex .apex-up .v { color: #7ee787; }
    .apex .apex-down .v { color: #ff7b72; }
    .cliptop { width: 320px; }
    .cliptop .cliptop-row { margin-bottom: 6px; }
    .cliptop .line { margin-bottom: 0; }
    .cliptop .line .k { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cliptop .cliptop-by { font-size: 11px; color: rgba(255, 255, 255, .45); }
    .stats .line .k { color: rgba(255, 255, 255, .62); }
    .stats .line .v { font-weight: 700; font-variant-numeric: tabular-nums; }

    /* Comparaison — barres relatives au meilleur des deux. */
    .versus .vs-label {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: rgba(255, 255, 255, .6); margin-bottom: 8px;
    }
    .versus .vs-row {
      margin-bottom: 8px; font-size: 13px;
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 90ms + 140ms);
    }
    .versus .vs-row .row {
      display: flex; justify-content: space-between; margin-bottom: 3px;
      font-variant-numeric: tabular-nums;
    }
    .versus .vs-row.lead .row { color: #7dffb0; font-weight: 700; }
    .versus .bar {
      height: 9px; border-radius: 5px; overflow: hidden;
      background: rgba(255, 255, 255, .1);
    }
    .versus .bar span {
      display: block; height: 100%; width: 0; border-radius: 5px;
      background: linear-gradient(90deg, #46c6ff, #9d7bff);
      transition: width .6s cubic-bezier(.3, .9, .3, 1);
    }
    .versus .vs-row.lead .bar span {
      background: linear-gradient(90deg, #34d17f, #7dffb0);
    }

    /* Compteur (uptime) — texte simple, lisible sur tout fond. */
    .counter {
      padding: 9px 16px;
      font-size: 26px; font-weight: 600; color: #fff;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
