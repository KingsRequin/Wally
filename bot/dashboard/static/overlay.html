<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wally Overlay</title>
  <style>
    /* Overlay OBS — destiné aux VIEWERS, jamais au streamer (il ne le voit pas
       pendant qu'il joue). Fond transparent, tout est en position fixe. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      height: 100vh;
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      /* Empêche OBS de sélectionner/afficher un curseur sur la source. */
      user-select: none;
      cursor: none;
    }

    #stage {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px;
      transition: opacity .4s ease;
    }
    #stage.hidden { opacity: 0; }

    /* ── Avatar ─────────────────────────────────────────────────────────── */
    #avatar-slot {
      position: relative;
      width: 200px;
      height: 200px;
      flex: 0 0 auto;
    }
    #avatar {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* transform/opacity uniquement : composé par le GPU, sans repaint. */
      transition: transform .25s ease;
      transform-origin: bottom center;
    }
    /* Réaction ponctuelle (raid, série de subs) — le personnage s'emballe. */
    #avatar-slot.reacting #avatar { animation: flare .9s ease-out; }
    @keyframes flare {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.18) rotate(-3deg); }
      60%  { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1); }
    }

    /* ── Bulle ──────────────────────────────────────────────────────────── */
    #bubble {
      position: relative;
      max-width: 300px;
      margin-bottom: 40px;
      padding: 11px 15px;
      font-size: 17px;
      line-height: 1.35;
      color: #fff;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 16px;
      /* Lisible sur n'importe quel gameplay, clair ou sombre. */
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
      opacity: 0;
      transform: translateY(8px) scale(.96);
      transition: opacity .22s ease, transform .22s ease;
      pointer-events: none;
    }
    #bubble.visible { opacity: 1; transform: translateY(0) scale(1); }

    /* Bulle de dialogue : pointe triangulaire vers l'avatar. */
    #bubble.speech::after {
      content: "";
      position: absolute;
      left: -8px;
      bottom: 14px;
      border-width: 7px 9px 7px 0;
      border-style: solid;
      border-color: transparent rgba(18, 18, 22, .88) transparent transparent;
    }

    /* Bulle de pensée : nuage + petits ronds (convention BD). */
    #bubble.thought {
      border-radius: 22px;
      font-style: italic;
      background: rgba(24, 24, 32, .8);
      border-style: dashed;
    }
    #bubble.thought::after,
    #bubble.thought::before {
      content: "";
      position: absolute;
      background: rgba(24, 24, 32, .8);
      border: 1px dashed rgba(255, 255, 255, .14);
      border-radius: 50%;
    }
    #bubble.thought::after  { left: -10px; bottom: 10px; width: 12px; height: 12px; }
    #bubble.thought::before { left: -20px; bottom: 0;    width: 7px;  height: 7px;  }

    /* ── Trois points, pendant la génération ────────────────────────────── */
    .dots { display: inline-flex; gap: 5px; align-items: center; height: 10px; }
    .dots span {
      width: 7px; height: 7px;
      background: rgba(255, 255, 255, .85);
      border-radius: 50%;
      animation: blink 1.25s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40%           { opacity: 1;   transform: translateY(-3px); }
    }

    /* ── Widgets (pile ou face, dé, uptime…) — phase 1b ─────────────────── */
    #widgets {
      position: absolute;
      left: 12px;
      bottom: 230px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="avatar-slot">
      <img id="avatar" src="/static/avatar/emotions/neutral/idle.gif" alt="">
    </div>
    <div id="bubble" class="speech"></div>
  </div>

  <div id="widgets"></div>

  <script src="/static/overlay.js"></script>
</body>
</html>
