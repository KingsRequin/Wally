<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wally Overlay</title>
  <style>
    /* Overlay OBS — destiné aux VIEWERS, jamais au streamer (il ne le voit pas
       pendant qu'il joue). Fond transparent, tout est en position fixe. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      height: 100vh;
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      /* Empêche OBS de sélectionner/afficher un curseur sur la source. */
      user-select: none;
      cursor: none;
    }

    #stage {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px;
      transition: opacity .4s ease;
    }
    #stage.hidden { opacity: 0; }

    /* ── Avatar ─────────────────────────────────────────────────────────── */
    #avatar-slot {
      position: relative;
      width: 200px;
      height: 200px;
      flex: 0 0 auto;
    }
    #avatar {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* transform/opacity uniquement : composé par le GPU, sans repaint. */
      transition: transform .25s ease;
      transform-origin: bottom center;
    }
    /* Réaction ponctuelle (raid, série de subs) — le personnage s'emballe. */
    #avatar-slot.reacting #avatar { animation: flare .9s ease-out; }
    @keyframes flare {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.18) rotate(-3deg); }
      60%  { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1); }
    }

    /* ── Bulle ──────────────────────────────────────────────────────────── */
    #bubble {
      position: relative;
      max-width: 300px;
      margin-bottom: 40px;
      padding: 11px 15px;
      font-size: 17px;
      line-height: 1.35;
      color: #fff;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 16px;
      /* Lisible sur n'importe quel gameplay, clair ou sombre. */
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
      opacity: 0;
      transform: translateY(8px) scale(.96);
      transition: opacity .22s ease, transform .22s ease;
      pointer-events: none;
    }
    #bubble.visible { opacity: 1; transform: translateY(0) scale(1); }

    /* Bulle de dialogue : pointe triangulaire vers l'avatar. */
    #bubble.speech::after {
      content: "";
      position: absolute;
      left: -8px;
      bottom: 14px;
      border-width: 7px 9px 7px 0;
      border-style: solid;
      border-color: transparent rgba(18, 18, 22, .88) transparent transparent;
    }

    /* Bulle de pensée : nuage + petits ronds (convention BD). */
    #bubble.thought {
      border-radius: 22px;
      font-style: italic;
      background: rgba(24, 24, 32, .8);
      border-style: dashed;
    }
    #bubble.thought::after,
    #bubble.thought::before {
      content: "";
      position: absolute;
      background: rgba(24, 24, 32, .8);
      border: 1px dashed rgba(255, 255, 255, .14);
      border-radius: 50%;
    }
    #bubble.thought::after  { left: -10px; bottom: 10px; width: 12px; height: 12px; }
    #bubble.thought::before { left: -20px; bottom: 0;    width: 7px;  height: 7px;  }

    /* ── Trois points, pendant la génération ────────────────────────────── */
    .dots { display: inline-flex; gap: 5px; align-items: center; height: 10px; }
    .dots span {
      width: 7px; height: 7px;
      background: rgba(255, 255, 255, .85);
      border-radius: 50%;
      animation: blink 1.25s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40%           { opacity: 1;   transform: translateY(-3px); }
    }

    /* ── Widgets (pile ou face, dé, uptime…) ────────────────────────────── */
    #widgets {
      position: absolute;
      left: 12px;
      bottom: 230px;
      pointer-events: none;
      /* Perspective partagée : les enfants tournent en 3D réelle. */
      perspective: 600px;
    }
    .widget {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .widget.visible { opacity: 1; transform: translateY(0); }

    /* Pièce — deux faces, rotation sur Y. Le classique CSS 3D : plus léger
       qu'un moteur, et composé par le GPU. */
    .coin {
      position: relative;
      width: 90px; height: 90px;
      transform-style: preserve-3d;
      animation: coin-flip 1.6s cubic-bezier(.3, .1, .2, 1) forwards;
    }
    .coin .face {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      backface-visibility: hidden;
      font-size: 30px; font-weight: 700; color: #3a2c00;
      background: radial-gradient(circle at 34% 30%, #ffe9a8, #e8b93d 55%, #b8860b);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5), inset 0 0 0 4px rgba(255,255,255,.25);
    }
    .coin .tails { transform: rotateY(180deg); }
    /* Le nombre de demi-tours décide de la face visible à l'arrêt :
       pair → pile, impair → face. Piloté par une variable, donc par Wally. */
    @keyframes coin-flip {
      0%   { transform: rotateY(0) translateY(0); }
      50%  { transform: rotateY(var(--half-turns-mid)) translateY(-55px); }
      100% { transform: rotateY(var(--half-turns)) translateY(0); }
    }

    /* Dé — cube à six faces. */
    .die {
      position: relative;
      width: 78px; height: 78px;
      transform-style: preserve-3d;
      animation: die-roll 1.5s cubic-bezier(.3, .1, .2, 1) forwards;
    }
    .die .side {
      position: absolute;
      width: 78px; height: 78px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; color: #1a1a1a;
      background: linear-gradient(150deg, #fdfdfd, #d8d8dc);
      border-radius: 12px;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .12);
    }
    .die .s1 { transform: rotateY(0deg)   translateZ(39px); }
    .die .s2 { transform: rotateY(90deg)  translateZ(39px); }
    .die .s3 { transform: rotateY(180deg) translateZ(39px); }
    .die .s4 { transform: rotateY(-90deg) translateZ(39px); }
    .die .s5 { transform: rotateX(90deg)  translateZ(39px); }
    .die .s6 { transform: rotateX(-90deg) translateZ(39px); }
    @keyframes die-roll {
      0%   { transform: rotateX(0) rotateY(0) translateY(0); }
      55%  { transform: rotateX(430deg) rotateY(380deg) translateY(-50px); }
      100% { transform: var(--final-rotation) translateY(0); }
    }

    /* Roue — secteurs colorés, rotation amortie, curseur fixe en haut. */
    .wheel-box { position: relative; width: 150px; height: 150px; }
    .wheel {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .85);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
      animation: wheel-spin 2.4s cubic-bezier(.16, .84, .28, 1) forwards;
    }
    .wheel-box .pin {
      position: absolute; top: -9px; left: 50%;
      margin-left: -8px;
      border-width: 0 8px 15px 8px;
      border-style: solid;
      border-color: transparent transparent #fff transparent;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6));
    }
    .wheel-box .label {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      padding: 5px 11px;
      max-width: 128px;
      font-size: 14px; font-weight: 700; color: #fff; text-align: center;
      background: rgba(18, 18, 22, .9);
      border-radius: 9px;
      opacity: 0;
      animation: wheel-label .5s ease 2.2s forwards;
    }
    @keyframes wheel-spin { to { transform: rotate(var(--final-angle)); } }
    @keyframes wheel-label { to { opacity: 1; } }

    /* Compte à rebours — le chiffre pulse à chaque seconde. */
    .countdown {
      min-width: 96px;
      padding: 8px 18px;
      font-size: 40px; font-weight: 700; color: #fff; text-align: center;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 14px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .9);
      font-variant-numeric: tabular-nums;
    }
    .countdown.tick { animation: tick .45s ease-out; }
    @keyframes tick {
      0%   { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    /* Jauge d'objectif. */
    .gauge { width: 230px; }
    .gauge .cap {
      margin-bottom: 5px;
      font-size: 14px; font-weight: 600; color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .95);
    }
    .gauge .track {
      height: 17px;
      background: rgba(18, 18, 22, .85);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 10px;
      overflow: hidden;
    }
    .gauge .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #46c6ff, #9d7bff);
      border-radius: 10px;
      transition: width 1.1s cubic-bezier(.2, .7, .3, 1);
    }

    /* Message du chat épinglé — c'est Wally qui choisit lequel mérite l'écran. */
    .pinned {
      max-width: 290px;
      padding: 9px 13px;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-left: 3px solid #9d7bff;
      border-radius: 10px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .pinned .who { font-size: 12px; font-weight: 700; color: #b79cff; }
    .pinned .msg { font-size: 15px; line-height: 1.3; }

    /* Compteur (uptime) — texte simple, lisible sur tout fond. */
    .counter {
      padding: 9px 16px;
      font-size: 26px; font-weight: 600; color: #fff;
      background: rgba(18, 18, 22, .88);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="avatar-slot">
      <img id="avatar" src="/static/avatar/emotions/neutral/idle.gif" alt="">
    </div>
    <div id="bubble" class="speech"></div>
  </div>

  <div id="widgets"></div>

  <script src="/static/overlay.js"></script>
</body>
</html>
