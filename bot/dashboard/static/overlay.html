       Portée de `overlay_image.html`. Même remarque que le rotateur : les
       `88vw`/`75vh` de la page d'origine devenaient faux dès que la zone a une
       place et une échelle à elle. */
    .image-galerie { display: none; }
    .image-galerie .cadre {
      position: relative;
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .1),
        0 12px 40px rgba(0, 0, 0, .6),
        0 0 80px rgba(183, 156, 255, .08);
    }
    .image-galerie img {
      display: block;
      max-width: var(--image-l, 1280px);
      max-height: var(--image-h, 720px);
      object-fit: contain;
    }
    .image-galerie .credit {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 24px 16px;
      background: linear-gradient(to top,
        rgba(0, 0, 0, .75) 0%, rgba(0, 0, 0, .3) 60%, transparent 100%);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    /* Vide, le dégradé barrerait le bas de l'image sans rien dire. */
    .image-galerie .credit:empty { display: none; }
    .image-galerie .credit-label {
      font-family: var(--display);
      font-size: 1.8rem;
      letter-spacing: .04em;
      color: rgba(255, 255, 255, .7);
    }
    .image-galerie .credit-nom {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--who);
      text-shadow: 0 0 20px rgba(183, 156, 255, .4);
      letter-spacing: -.02em;
    }
  </style>
</head>
<body data-side="right" data-scene-slug="">
  <!-- Un conteneur par élément du modèle (`bot/core/overlay_layout.py`) : ils
       ne partagent plus ni place ni bord. `overlay_layout.js` leur pose leur
       position, leur échelle et leur empilement ; `overlay.js` dépose la carte
       d'un widget dans le conteneur de son `kind`.

       L'ORDRE du document est l'empilement de repli, avant que le modèle n'ait
       répondu : il suit `_ORDRE_DEFAUT` à l'envers — le dernier écrit passe
       devant. Un test Python vérifie qu'aucune clé du modèle n'y manque : un
       conteneur absent, c'est un widget qui n'apparaît nulle part et ne dit
       rien. -->
  <div id="stage">
    <div data-element="stats"></div>
    <div data-element="bingo"></div>
    <div data-element="talkers"></div>
    <!-- Le rotateur de memes, jadis la source OBS `/overlay-rotation`. Le
         contenu vit ici, la boucle dans `overlay.js` : elle ne tourne que si la
         scène ne masque pas cet élément — un rotateur masqué ne télécharge
         rien. -->
    <div data-element="rotator">
      <div class="rotateur" id="rotateur">
        <img id="rotateur-image" alt="">
        <video id="rotateur-video" class="absent" playsinline></video>
      </div>
    </div>
    <!-- Les huit panneaux d'`overlay_apex.js` : fusionnés dans `BUILDERS` par
         `Object.assign`, publiés comme n'importe quel autre widget. -->
    <div data-element="apex_servers"></div>
    <div data-element="apex_predator"></div>
    <div data-element="apex_craft"></div>
    <div data-element="apex_map"></div>
    <div data-element="apex_stats"></div>
    <div data-element="apex_status"></div>
    <div data-element="apex_progress"></div>
    <div data-element="apex_rank"></div>
    <div data-element="rps"></div>
    <div data-element="countdown"></div>
    <div data-element="gauge"></div>
    <div data-element="wheel"></div>
    <div data-element="dice"></div>
    <div data-element="coinflip"></div>
    <div data-element="counter"></div>
    <div data-element="pinned"></div>
    <div data-element="hangman"></div>
    <div data-element="poll"></div>
    <div data-element="versus"></div>
    <div data-element="wave"></div>
    <div data-element="virus_popup"></div>
    <div data-element="music_now"></div>
    <div data-element="apex_kills"></div>
    <div data-element="raid"></div>
    <div data-element="quote"></div>
    <div data-element="prediction"></div>
    <div data-element="planning"></div>
    <div data-element="clip_top"></div>
    <div data-element="clip"></div>
    <div data-element="meme"></div>
    <!-- L'image de la galerie, jadis la source OBS `/overlay-image`. Poussée
         par le bot (`!image` sur Twitch) via son propre flux SSE. -->
    <div data-element="image">
      <div class="image-galerie" id="image-galerie">
        <div class="cadre">
          <img id="image-galerie-img" alt="">
          <div class="credit" id="image-galerie-credit"></div>
        </div>
      </div>
    </div>

    <!-- Avatar : animation WebM en boucle, volontairement PAS liée aux émotions
         (Rive écarté, son export étant payant). `muted` est requis pour que la
         lecture automatique démarre sans interaction, ce qu'OBS ne fait jamais.

         Le conteneur ENVELOPPE le slot au lieu de le remplacer : `#avatar-slot`
         porte déjà un `transform` (le miroir de `data-side`) et ses enfants une
         animation, que le `transform` du placement écraserait. Même raison pour
         la bulle, dont le `transform` porte l'apparition. -->
    <div data-element="avatar">
      <div id="avatar-slot">
        <video id="avatar" src="/static/avatar/wally.webm"
               autoplay loop muted playsinline disablepictureinpicture></video>
      </div>
    </div>
    <div data-element="bubble">
      <div id="bubble" class="speech"><div id="bubble-text"></div></div>
    </div>
  </div>

  <!-- canvas-confetti (ISC) — servi en local, jamais depuis un CDN : l'overlay
       tourne dans OBS et ne doit dépendre d'aucun réseau tiers.
       Voir bot/dashboard/static/vendor/README.md -->
  <script src="/static/vendor/canvas-confetti.js"></script>
  <!-- spin-wheel (MIT) — la roue, labels dessinés dans les secteurs. -->
  <script src="/static/vendor/spin-wheel.js"></script>
  <!-- Chargé avant `overlay.js`, qui s'en sert pour la sortie des bulles. -->
  <script src="/static/glitch.js"></script>
  <!-- Chargé avant `overlay.js`, qui y dépose ses widgets et lui demande le
       placement. -->
  <script src="/static/overlay_layout.js"></script>
  <script src="/static/overlay_apex.js"></script>
  <script src="/static/overlay_virus.js"></script>
  <script src="/static/overlay_sons.js"></script>
  <script src="/static/overlay.js"></script>
</body>
</html>
