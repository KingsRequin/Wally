<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wally Overlay</title>
  <!-- animate.css — les animations d'entrée et de sortie de l'image de la
       galerie, dont le NOM vient de la configuration (`overlay_image`) : le
       propriétaire les choisit dans le panneau. Sans cette feuille, la classe
       `animate__fadeIn` ne désigne rien et l'image apparaîtrait sèchement.
       Hébergée ici, pas sur un CDN : une source de live ne doit pas dépendre du
       réseau sortant d'OBS. Déclarée AVANT le style de la page, qui doit
       l'emporter. -->
  <link rel="stylesheet" href="/static/animate.min.css">
  <style>
    /* Overlay OBS — destiné aux VIEWERS, jamais au streamer (il ne le voit pas
       pendant qu'il joue). Fond transparent, tout est en position fixe. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Auto-hébergées : OBS ne doit pas dépendre d'un appel réseau pour afficher
       du texte pendant un live. `swap` plutôt que `block` : mieux vaut une
       fraction de seconde dans la police de repli qu'une bulle vide.
       Fredoka est VARIABLE (300–700) : les widgets demandent du 400 comme du
       700, et un fichier à poids unique ferait fabriquer au navigateur un faux
       gras baveux. */
    @font-face {
      font-family: "Fredoka";
      src: url("/static/fonts/fredoka.woff2") format("woff2");
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Bangers";
      src: url("/static/fonts/bangers.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    /* Les bulles sont des BOÎTES sombres, sans contour, avec une ombre portée
       dure et décalée — un aplat, pas un cadre. Le contour épais et la
       silhouette organique ont été abandonnés : ce que le propriétaire veut est
       une box, pas un ovale dessiné.

       L'aplat lui-même reste OPAQUE. La légère transparence est portée par
       `--bulle-voile`, appliquée à l'ÉLÉMENT et non à la couleur de fond : la
       pointe mord de 8 px dans la boîte, et deux aplats translucides superposés
       feraient apparaître une tache plus sombre à la jonction. Posée sur
       l'élément, elle compose d'abord la bulle entière en un seul calque, puis
       la voile — le recouvrement disparaît. Même principe que la silhouette du
       nuage, qui se dessinait en deux passes opaques pour la même raison. */
    :root {
      --bulle-fond:  #16141f;
      --bulle-texte: #f7f3e9;
      --bulle-voile: .88;
      /* Flou de l'ARRIÈRE-PLAN, pas de la bulle. Volontairement court : un
         `backdrop-filter` relit le fond et le refloute à chaque image, sur une
         machine qui fait déjà tourner le jeu et l'encodage. */
      --bulle-flou: 5px;
      /* Décalée et sans flou : c'est ce décalage net qui fait le style. Portée
         par un `drop-shadow` et non une `box-shadow`, pour qu'elle suive la
         SILHOUETTE — pointe comprise — et pas la boîte. */
      --bulle-ombre: 6px 6px 0 rgba(0, 0, 0, .45);

      /* Le verre sombre des widgets — UNE valeur. Elle traînait à quatre
         opacités différentes (.85 .88 .90 .92), au gré de l'ordre d'écriture. */
      --glass: rgba(18, 18, 22, .9);
      --line:  rgba(255, 255, 255, .14);
      --dim:   rgba(255, 255, 255, .6);
      --dimmer: rgba(255, 255, 255, .42);

      /* Un accent par INTENTION, pas par widget. Il y en avait quinze : quatre
         verts disaient « gagné », quatre rouges « perdu », quatre ambres
         « attention ». Chaque widget avait redécidé dans son coin. */
      --win:      #7dffb0;   /* gagné, en tête, actif */
      --win-deep: #34d17f;   /* fond du dégradé de victoire */
      --lose:     #ff7d7d;   /* perdu, raté, en baisse */
      --gold:     #ffd166;   /* 1re place, raid, distinction */
      --wally:    #ffb066;   /* ce qui appartient à Wally — l'orange de la flamme */
      --who:      #b79cff;   /* qui parle, qui joue */
      --who-deep: #9d7bff;   /* fond du dégradé de quantité */
      --info:     #46c6ff;   /* quantité neutre, clip, lien */

      /* Trois rayons, contre sept auparavant (2 5 8 10 12 14 16). */
      --r-xs: 3px;
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 16px;

      /* Trois durées et deux courbes, contre onze réglages improvisés. La
         nuance qui compte : `--ease` pose sans rebondir, `--ease-pop` dépasse
         légèrement — réservé à ce qui ENTRE en scène. Les animations physiques
         (pièce, dé, roue, remplissage de barre) gardent leur temps propre :
         elles simulent un mouvement, elles ne suivent pas une charte. */
      --t-fast: .18s;
      --t-base: .3s;
      --t-slow: .42s;
      --ease:     cubic-bezier(.22, .9, .3, 1);
      --ease-pop: cubic-bezier(.22, 1.35, .36, 1);
      /* Une sortie ACCÉLÈRE et s'en va ; elle ne rebondit pas. `--ease-pop`
         était déclarée sur la règle de base, donc elle s'appliquait dans les
         DEUX sens : la bulle dépassait et revenait en partant. Le commentaire
         d'origine annonçait pourtant « retrait plus sec au départ » — l'intention
         était là, la déclaration ne la tenait pas. */
      --t-out:   .16s;
      --ease-in: cubic-bezier(.5, 0, .85, .35);

      /* La police qui ANNONCE : capitales penchées, réservée aux étiquettes et
         aux gros moments. Wally, lui, parle en Fredoka — sinon il aurait l'air
         de crier à chaque réplique. */
      --display: "Bangers", "Segoe UI", sans-serif;
    }

    body {
      background: transparent;
      overflow: hidden;
      height: 100vh;
      font-family: "Fredoka", "Segoe UI", Roboto, system-ui, sans-serif;
      /* Empêche OBS de sélectionner/afficher un curseur sur la source. */
      user-select: none;
      cursor: none;
    }

    /* Le cadre entier, et rien d'autre. `#stage` n'impose plus AUCUN flux :
       il ne sert qu'à masquer l'overlay d'un bloc (`.hidden`, piloté par le
       SSE) et à donner un repère aux positions absolues des éléments. La rangée
       flex qu'il portait est ce qu'on supprime : elle imposait une place à
       l'avatar et à la bulle, alors que c'est le modèle qui la donne. */
    #stage {
      position: absolute;
      inset: 0;
      transition: opacity var(--t-slow) var(--ease);
    }
    #stage.hidden { opacity: 0; }

    /* ── Placement piloté par le modèle ────────────────────────────────────
       Chaque élément est posé en absolu et reçoit ses bords, sa translation et
       son échelle de `overlay_layout.js`. Aucune position n'est écrite ici :
       ce fichier ne décrit plus QUE l'apparence.

       `#widgets` disparaît en tant que conteneur : il imposait un flux commun
       à dix-sept widgets, ce qui est exactement ce qu'on supprime. Chaque
       `kind` a désormais son conteneur, et `overlay.js` y dépose sa carte. */
    [data-element] {
      position: absolute;
      /* Une grille à UNE cellule, où tous les enfants se superposent. C'est ce
         qui permet à la carte qui SORT et à celle qui ENTRE de partager la
         place sans que l'une quitte le flux.

         Le `position: absolute` qui servait à ça sur `.leaving` ne tient plus
         depuis que chaque widget a son conteneur : hors flux, la carte ne le
         dimensionne plus, il retombe à 0×0, et le `translate(-50%, -50%)` de
         l'ancrage ne translate alors plus de rien — la carte se téléportait
         (+w/2 à droite, −h/2 vers le haut en `center` ; toute sa largeur hors
         cadre en `bottom-right`) pendant toute son animation de sortie. */
      display: grid;
      grid-template-areas: "pile";
      /* Sans lui, une largeur en pourcentage se calculerait sur le viewport
         entier ; les widgets ont leur taille propre, ils ne s'étirent pas. */
      width: max-content;
      max-width: 92vw;
      /* L'overlay est une source OBS : rien n'y est cliquable, et un clic
         perdu sur une carte capterait le curseur du streamer. */
      pointer-events: none;
      /* Perspective : la pièce et le dé tournent en 3D réelle. Elle était
         posée sur `#widgets` — sans elle ici, la pièce s'aplatit. */
      perspective: 600px;
    }
    /* Tous dans LA cellule : c'est ce qui les superpose. */
    [data-element] > * { grid-area: pile; }

    /* Repli avant que le modèle ne réponde : la page n'est jamais un tas
       d'éléments empilés dans le coin. Volontairement GROSSIER — trois zones,
       pas vingt-six réglages recopiés du Python, qui divergeraient au premier
       ajustement. Le placement réel vient de `/api/public/overlay-layout`. */
    [data-element] { left: 50%; top: 50%; transform: translate(-50%, -50%); }
    [data-element="avatar"] {
      left: auto; top: auto; right: 3%; bottom: 20%; transform: scale(.55);
      transform-origin: right bottom;
    }
    [data-element="bubble"] {
      left: auto; top: auto; right: 5%; bottom: 38%; transform: scale(.9);
      transform-origin: right bottom;
    }
    [data-element="bingo"],
    [data-element="stats"],
    [data-element="talkers"] {
      left: 3%; top: 18%; transform: scale(.9); transform-origin: left top;
    }
    [data-element="talkers"] { top: 40%; }
    [data-element="stats"]   { top: 60%; }

    /* ── Repères de placement ───────────────────────────────────────────────
       Posés par « Tout afficher » du panneau de mise en scène, et retirés au
       bout de 30 s. Ils ne sortent JAMAIS en direct : l'événement qui les
       demande porte le slug de la scène qu'on est en train de régler, et toute
       autre page l'écarte.

       Volontairement PLAT — un contour et un nom : un repère qui se donnerait
       des airs de widget ferait douter de ce qu'on regarde. */
    .ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border: 2px dashed rgba(255, 255, 255, 0.55);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
    }
    .ghost-nom {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      padding: 0 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Avatar ─────────────────────────────────────────────────────────── */
    #avatar-slot {
      position: relative;
      width: 200px;
      height: 200px;
      flex: 0 0 auto;
    }
    /* Vise l'enfant du slot, quel qu'il soit (video, img…) : remplacer l'avatar
       ne demande pas de retoucher ce fichier. */
    #avatar-slot > * {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* transform/opacity uniquement : composé par le GPU, sans repaint.
         La transition est posée plus bas, avec l'effacement pendant un
         widget — elle était déclarée DEUX fois, dont une jamais appliquée. */
      transform-origin: bottom center;
    }
    /* Wally accuse le coup quand il parle : la bulle ne surgit plus à côté d'un
       personnage indifférent. Volontairement discret — la boucle vidéo de
       l'avatar respire déjà largement (la silhouette varie de 19 % en hauteur
       sur ses 3,7 s), une animation ample par-dessus la ferait bégayer.
       Le miroir de l'ancrage à droite porte sur le SLOT : la tête penche donc
       toujours vers la bulle, des deux côtés. */
    #avatar-slot.speaking > * { animation: nod var(--t-slow) var(--ease); }
    @keyframes nod {
      0%   { transform: none; }
      38%  { transform: translateY(-4px) rotate(-2.5deg); }
      100% { transform: none; }
    }

    /* Réaction ponctuelle (raid, série de subs) — le personnage s'emballe.
       Déclarée APRÈS le hochement : un gros moment l'emporte sur une réplique. */
    #avatar-slot.reacting > * { animation: flare .9s ease-out; }
    @keyframes flare {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.18) rotate(-3deg); }
      60%  { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1); }
    }

    /* ── Ancrage à droite (défaut) ──────────────────────────────────────
       La source est posée sur le bord DROIT de l'écran. Les POSITIONS viennent
       désormais du modèle : il ne reste ici que ce qui regarde vers le contenu
       — l'avatar retourné, et l'accroche de la bulle. `?side=left` rétablit
       l'ancrage à gauche.
       Le miroir porte sur le SLOT, pas sur l'avatar : l'animation de réaction
       (.reacting) écrit sur `transform` et effacerait un scaleX posé là — et
       le slot n'est plus le nœud placé, c'est son conteneur qui l'est. */
    body[data-side="right"] #avatar-slot { transform: scaleX(-1); }
    body[data-side="right"] .widget { justify-content: flex-end; }

    /* Pointes de bulle : elles visent l'avatar, donc elles changent de côté.
       La pointe de PAROLE n'a plus de miroir : elle pivote (`--angle-pointe`),
       ce qui couvre les quatre côtés au lieu de deux. */
    body[data-side="right"] #bubble.thought::after  { left: auto; right: 34px; }
    body[data-side="right"] #bubble.thought::before { left: auto; right: 14px; }

    /* ── Bulle ──────────────────────────────────────────────────────────── */
    #bubble {
      position: relative;
      /* Une box n'a plus besoin d'être étroite : c'est l'ovale qui paraissait
         plat au-delà d'un certain rapport, pas un rectangle. La seconde borne
         ne vaut plus que pour une source ÉTROITE — la bulle ne partage plus sa
         rangée avec l'avatar, elle a sa propre place. */
      max-width: min(300px, calc(100vw - 234px));
      /* La marge basse de 132 px a disparu avec la rangée flex : elle remontait
         la bulle à hauteur de tête PAR-DESSUS l'avatar, qui la poussait par le
         bas. La bulle a maintenant sa place à elle (`bubble` y=62, l'avatar
         y=80) ; la marge s'ajouterait à cet écart et la décrocherait. */
      /* Marges d'une box : les 36 px en Y ne servaient qu'à éloigner le texte
         d'une silhouette qui se refermait sur les côtés. */
      padding: 16px 22px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      /* Lettrage de BD : centré dans la bulle, jamais aligné à gauche. */
      text-align: center;
      color: var(--bulle-texte);
      background: var(--bulle-fond);
      border-radius: 18px;
      /* Détache la bulle du gameplay sans l'assombrir davantage. Clippé par le
         rayon, donc il suit la boîte. */
      -webkit-backdrop-filter: blur(var(--bulle-flou));
      backdrop-filter: blur(var(--bulle-flou));
      /* L'ombre suit la silhouette, pointe comprise : une `box-shadow` s'
         arrêterait à la boîte et laisserait la pointe à plat. */
      filter: drop-shadow(var(--bulle-ombre));
      opacity: 0;
      transform: translateY(8px) scale(.88);
      /* Elle grandit depuis sa QUEUE, pas depuis son centre : elle sort de la
         bouche de Wally au lieu de se matérialiser à côté de lui. */
      transform-origin: 0% 50%;
      /* Réglages de SORTIE (l'état par défaut est celui vers lequel on revient).
         L'entrée a les siens, sur `.visible`. */
      transition: opacity var(--t-out) var(--ease-in), transform var(--t-out) var(--ease-in);
      pointer-events: none;
    }
    body[data-side="right"] #bubble { transform-origin: 100% 50%; }
    #bubble.visible {
      opacity: var(--bulle-voile);
      transform: translateY(0) scale(1);
      /* Entrée : dépassement léger, le ressort d'une bulle qui « pop ». */
      transition: opacity var(--t-fast) var(--ease), transform var(--t-slow) var(--ease-pop);
    }

    /* Le texte porte seul le garde-fou anti-débordement : une réplique trop
       longue est coupée net plutôt que de pousser le décor hors de l'écran.
       Il est sur un élément INTERNE, sinon le `overflow: hidden` rognerait la
       queue de la bulle, qui déborde volontairement. */
    #bubble-text {
      /* `--bulle-place` est la hauteur de mise en page réellement disponible,
         calculée par `overlay_layout.js` depuis l'ancrage, la position et
         l'échelle de la bulle — aucun nombre écrit ici ne pourrait être juste,
         les trois étant réglables. On en retire les 32 px de marges hautes et
         basses de la bulle (`padding: 16px 22px`, juste au-dessus) : la borne
         porte sur le TEXTE, pas sur la boîte.

         Le repli de 50vh vaut avant que le modèle n'ait répondu, et il
         SOUS-promet exprès : une réplique coupée trop tôt se voit et se règle,
         une bulle qui sort par le haut de la source ne se voit pas. C'est
         l'inverse du garde-fou d'avant, qui autorisait plus que ce qui tient. */
      max-height: calc(var(--bulle-place, 50vh) - 32px);
      overflow: hidden;
    }

    /* Pointe de la bulle : un triangle du MÊME aplat, posé au coin bas, du côté
       de l'avatar, effilé vers lui. Sans contour à raccorder, la jonction n'a
       plus lieu d'être réglée — c'est ce qui avait coûté trois passes sur la
       version dessinée : deux traits qui doivent se rejoindre au pixel.
       Poussée DANS l'angle : c'est ce qui la fait lire comme la bouche de
       Wally, et non comme un appendice au milieu du bord.

       Le rayon de 18 px interdit d'aller jusqu'au coin exact — le bord s'y
       incurve et un liseré de fond apparaîtrait entre la boîte et la pointe.
       Elle mord donc dans la boîte : sa BASE est à 6 px au-dessus du bord bas,
       à l'intérieur de l'aplat, et seule sa pointe dépasse.

       Elle PIVOTE désormais autour de cette base (`--angle-pointe`, posé par
       `overlay_layout.js`) au lieu d'être figée dans un coin par des règles
       miroir : la bulle se place librement, une position de plus n'aurait pas
       eu sa règle. Le coin de départ suit lui aussi l'avatar (`--x-pointe`).
       Défauts : coin droit, pointe vers le bas — la disposition d'origine.

       JAMAIS d'`overflow` sur `#bubble` : la pointe est un pseudo-élément qui
       déborde volontairement, et elle a disparu des semaines pour ça. */
    #bubble.speech::after {
      content: "";
      position: absolute;
      /* `left` porte le PIVOT : la base du triangle, pas son sommet. */
      left: var(--x-pointe, calc(100% - 24px));
      /* La boîte fait 22 px de haut, son centre tombe donc 6 px au-dessus du
         bord bas de la bulle : la base reste noyée dans l'aplat. */
      bottom: -5px;
      width: 28px;
      height: 22px;
      background: var(--bulle-fond);
      /* Au repos, le triangle est effilé vers la DROITE (0°) : la rotation le
         fait ensuite viser l'avatar, où qu'il soit. */
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      transform-origin: 0 50%;
      transform: rotate(var(--angle-pointe, 90deg));
    }
    /* L'avatar masqué, la pointe viserait le vide : elle s'efface. */
    #bubble.sans-pointe::after,
    #bubble.sans-pointe::before { display: none; }

    /* Bulle de pensée : un vrai nuage de BD, pour qu'on ne la confonde JAMAIS
       avec une réplique. */
    #bubble.thought {
      font-style: italic;
      /* Une ELLIPSE, pas un nuage à bosses : `border-radius: 50%` sur une boîte
         large en donne une exactement, sans le moindre SVG. La silhouette
         vectorielle qui servait ici n'avait plus lieu d'être — elle existait
         pour porter des bosses et un contour, dont plus rien ne dépend.
         Marges larges : le texte d'une pensée est borné à 90 caractères, et
         une ellipse se referme sur ses coins. */
      border-radius: 50%;
      padding: 30px 50px;
    }

    /* Les deux bulles satellites qui descendent vers l'avatar : la signature
       visuelle de la pensée en BD. Détachées du nuage, jamais superposées :
       deux contours qui se croisent trahissent le montage. */
    #bubble.thought::after,
    #bubble.thought::before {
      content: "";
      position: absolute;
      background: var(--bulle-fond);
      border-radius: 50%;
    }
    #bubble.thought::after  { left: 34px; bottom: -14px; width: 34px; height: 24px; }
    #bubble.thought::before { left: 14px; bottom: -38px; width: 20px; height: 15px; }
    /* Une pensée MONTE : le plus petit satellite apparaît d'abord, puis le
       second, puis le nuage se déploie. C'est la grammaire de la BD — un bloc
       qui surgit d'un coup lit comme une réplique, pas comme une pensée.
       `backwards` maintient l'échelle 0 pendant le délai, sinon les satellites
       seraient déjà là, à taille pleine, avant leur tour. */
    #bubble.thought.visible::before { animation: puff .3s var(--ease-pop) 0ms   backwards; }
    #bubble.thought.visible::after  { animation: puff .3s var(--ease-pop) 70ms  backwards; }
    #bubble.thought.visible { transition-delay: 0s, 150ms; }
    @keyframes puff { from { transform: scale(0); } to { transform: scale(1); } }
    /* Ancrage à droite : les satellites descendent vers l'avatar, donc à droite. */
    body[data-side="right"] #bubble.thought::after  { left: auto; right: 26px; }
    body[data-side="right"] #bubble.thought::before { left: auto; right: 8px; }

    /* ── Éclatement, à la disparition ───────────────────────────────────────
       Une bulle d'eau qui se rompt, PAS une explosion. La différence tient en
       deux points : le film gonfle d'abord sous la tension, et les gouttes
       partent du BORD sur une course courte, avec un rien de gravité. Une
       explosion partirait du centre, vite et loin.

       Deux dosages : la bulle de parole disparaît toutes les quelques secondes
       (155 relevées sur un live), les widgets sont bien plus rares. Même
       grammaire, moitié moins de gouttes — sinon l'overlay crépite en continu. */
    /* La sortie est parasitée par le glitch de `glitch.js` — le même que celui
       du rotateur de memes, qui s'affiche sur le même stream. Rien à déclarer
       ici : la rafale tire ses états au sort et écrit `clip-path`, `transform`,
       `filter` et `opacity` EN LIGNE, où ils l'emportent sur cette feuille.
       L'ombre portée de la bulle cède donc d'elle-même, son `filter` étant
       remplacé à chaque état. */

    /* ── Trois points, pendant la génération ────────────────────────────── */
    .dots { display: inline-flex; gap: 5px; align-items: center; height: 10px; }
    .dots span {
      width: 7px; height: 7px;
      background: var(--bulle-texte);
      border-radius: 50%;
      animation: blink 1.25s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40%           { opacity: 1;   transform: translateY(-3px); }
    }

    /* ── Widgets (pile ou face, dé, uptime…) ────────────────────────────── */
    /* Chaque widget vit dans le conteneur de son `kind` (`[data-element]`, plus
       haut), qui porte sa position, son échelle et sa perspective. Le conteneur
       unique `#widgets` a disparu : c'est lui qui obligeait dix-sept widgets à
       partager une place, un bord et un ordre. */
    /* La bulle s'efface pendant un widget : l'écran est petit, mieux vaut une
       chose lisible que deux qui se disputent la place. */
    body.widget-on #bubble { opacity: 0; transform: translateY(6px) scale(.97); }

    /* L'avatar cède la place, sans disparaître brutalement. */
    #avatar-slot > * { transition: transform var(--t-slow) var(--ease), opacity var(--t-base) var(--ease); }
    .widget {
      /* Un widget peut occuper toute la zone : l'avatar ET la bulle s'effacent
         pendant son affichage, il n'a personne à ménager. Chaque widget fixe
         ensuite sa propre largeur. */
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      opacity: 0;
      /* Le widget monte depuis la place de l'avatar, qui s'efface en même temps
         — un passage de relais plutôt qu'une superposition. */
      transform: translateY(16px) scale(.9);
      /* Il monte de la place de l'avatar : c'est de là qu'il doit grandir. */
      transform-origin: bottom left;
      transition: opacity var(--t-out) var(--ease-in), transform var(--t-out) var(--ease-in);
    }
    body[data-side="right"] .widget { transform-origin: bottom right; }
    /* `.leaving` n'a plus AUCUNE règle de mise en page : la superposition est
       portée par la grille à une cellule du conteneur (plus haut). La carte qui
       sort reste donc dans le flux, à sa place exacte, pendant que la suivante
       entre par-dessus. La classe garde son seul rôle : dire au JS de ne plus
       la compter comme la carte en place (`WIDGET_EN_PLACE`). */
    .widget.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity var(--t-base) var(--ease), transform var(--t-slow) var(--ease-pop);
    }
    /* La carte du BANC DE MESURE (`WallyBanc`, overlay.js) : montée puis
       retirée dans la même tâche JavaScript, le temps de lire sa boîte pour le
       panneau de mise en scène. `visibility: hidden` et pas `display: none` —
       il faut qu'elle soit MISE EN PAGE pour être mesurable, et invisible pour
       ne rien projeter si cette page est celle du live. L'animation d'entrée
       est coupée : elle ne changerait pas la mise en page, mais rien ne doit
       tourner pour une carte que personne ne verra. */
    .widget.banc {
      visibility: hidden;
      transition: none;
      animation: none;
    }
    .widget.banc * { animation: none !important; transition: none !important; }

    /* ── Avalanche de memes ────────────────────────────────────────────────
       Achetée 50 000 points de chaîne : une pluie dense qui submerge l'écran
       une demi-minute, puis s'en va.

       La carte OCCUPE le canvas par sa TAILLE — jamais par un `position:
       fixed`. C'est le piège qui a rendu le planning invisible tout un stream :
       `.widget` porte un `transform` (son animation d'entrée), et un ancêtre
       transformé devient le bloc conteneur de tout `fixed` descendant. Le
       `fixed` n'aurait donc pas visé la source OBS mais la carte elle-même.
       Un test du dépôt l'interdit, et il m'a arrêté ici même. */
    /* Bilan de fin de partie Apex. Le chiffre porte l'information : il est gros,
       le reste est du contexte.

       « Il y a pas de fond, c'est pas visible » (owner, 2026-08-19) : cette
       carte portait le verre du DASHBOARD — du blanc à 4 % — copié tel quel
       d'une page qui a toujours un fond sombre derrière elle. Par-dessus une
       image de jeu, ça ne pose rien. Les widgets de l'overlay tiennent leur
       lisibilité de `--glass`, un verre SOMBRE presque opaque, et d'une ombre
       portée sur le texte. */
    .apex-kills {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    /* `--win` et non un cyan à soi : la charte donne un accent par INTENTION,
       et des kills sont une réussite — le même vert que « en tête » ailleurs. */
    .apex-kills .ak-chiffre {
      font-size: 40px; font-weight: 800; line-height: 1;
      color: var(--win); font-variant-numeric: tabular-nums;
    }
    .apex-kills .ak-quoi { font-size: 15px; font-weight: 600; }
    .apex-kills .ak-cumul { font-size: 12px; color: var(--dim); margin-top: 3px; }
    /* Les points de rang, à part : ils ne sont là qu'une partie sur deux, et
       les coller au cumul ferait sauter la carte d'une largeur à l'autre sans
       qu'on comprenne pourquoi. Détachée par un trait, la pastille se lit comme
       un ajout, pas comme une colonne qui manque le reste du temps. */
    .apex-kills .ak-rp {
      padding-left: 14px;
      border-left: 1px solid var(--line);
      font-size: 19px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .apex-kills .ak-rp.gagne { color: var(--win); }
    .apex-kills .ak-rp.perd { color: var(--lose); }

    /* Musique en cours — une étiquette, pas un spectacle : elle s'installe et
       laisse la scène aux autres.

       La forme, les durées et les courbes viennent du design de l'owner et sont
       reprises TELLES QUELLES : pilule, disque à 64 px, déroulé de la gauche,
       texte qui arrive net après un flou, équaliseur qui se déplie. Seuls le
       fond et la bordure sont passés au thème de l'overlay (`--glass`,
       `--line`), comme les autres cartes — c'était la seule adaptation demandée.

       Deux couches et non une : `.music-now` porte l'OMBRE, `.music-pilule`
       porte le fond et la DÉCOUPE. Sur un seul élément, le `clip-path` du
       déroulé coupe le `box-shadow` — et pas seulement le temps de l'animation :
       `inset(0 0 0 0)` colle à la boîte, donc la lueur colorée resterait
       amputée pour toujours. Un `filter: drop-shadow` ne sauve rien, il
       s'applique AVANT le clip. C'est la même famille de piège que
       l'`overflow: hidden` qui avalait la pointe de bulle. */
    .music-now {
      /* La couleur du morceau, tirée de sa pochette par le JS. Elle retombe sur
         l'accent de l'overlay quand il n'y a pas d'image : un morceau sans
         pochette reste lisible, il est juste moins habillé. */
      --accent-morceau: var(--info);
      --accent-doux: rgba(255, 255, 255, .66);
      /* La bordure suit la pochette elle aussi. Assez diluée pour rester une
         bordure et non un liseré fluo : c'est le contour de la carte, pas un
         accent de plus. Sans pochette, elle retombe sur le trait des autres
         cartes de l'overlay. */
      --bord-morceau: var(--line);
      display: flex;
      /* La lueur porte la couleur du morceau : le seul endroit où elle déborde
         de la carte, et ce qui la fait exister par-dessus du gameplay. */
      border-radius: 999px;
      box-shadow: 0 18px 44px -18px var(--lueur-morceau, rgba(0, 0, 0, .6));
      opacity: 0;
      transform: translateX(-14px);
      transition: opacity .28s ease,
                  transform .38s cubic-bezier(.2, .9, .2, 1);
    }
    .widget.visible .music-now {
      opacity: 1;
      transform: translateX(0);
      transition: opacity .2s ease,
                  transform .45s cubic-bezier(.2, .9, .2, 1);
    }

    .music-now .music-pilule {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 26px 12px 12px;
      border-radius: 999px;
      /* Le fond au thème de l'overlay ; la bordure, elle, suit la pochette. Le
         verre du dashboard ne s'applique pas ici : un blanc à 4 % est
         invisible en live. */
      background: var(--glass);
      border: 1px solid var(--bord-morceau);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      /* Le déroulé : la pilule se tire depuis la gauche, du côté du disque. */
      clip-path: inset(0 100% 0 0 round 999px);
      transition: clip-path .5s cubic-bezier(.2, .9, .2, 1) .06s,
                  border-color .45s ease;
    }
    .widget.visible .music-now .music-pilule {
      clip-path: inset(0 0 0 0 round 999px);
      transition: clip-path .55s cubic-bezier(.2, .9, .2, 1),
                  border-color .45s ease;
    }

    /* Le disque. Il tourne tant que ça joue et se fige en pause, pochette ou
       pas : le vinyle nu reste un vinyle. */
    .music-now .music-disque {
      position: relative;
      width: 64px; height: 64px;
      flex: none;
      border-radius: 999px;
      overflow: hidden;
      background: #1a1a1f;
      transform: scale(.72) rotate(-28deg);
      transition: transform .34s cubic-bezier(.4, 0, .7, .4);
    }
    /* `scale(1)` et non `none` : le disque garde ainsi son contexte
       d'empilement, sans lequel Chromium laisse la pochette EN ROTATION
       déborder des coins d'un parent arrondi. */
    .widget.visible .music-now .music-disque {
      transform: scale(1) rotate(0deg);
      transition: transform .5s cubic-bezier(.18, 1.3, .32, 1);
    }
    .music-now .music-pochette,
    .music-now .music-reflet {
      position: absolute; inset: 0;
      animation: music-tourne 9s linear infinite;
      /* Figée par défaut, relancée par `.joue` : l'état de lecture est dans le
         MOUVEMENT, ici comme sur l'équaliseur. */
      animation-play-state: paused;
    }
    .music-now.joue .music-pochette,
    .music-now.joue .music-reflet { animation-play-state: running; }
    .music-now .music-pochette { width: 100%; height: 100%; object-fit: cover; }
    /* Le reflet qui balaie la galette : c'est lui qui fait lire « vinyle »
       plutôt que « vignette ronde ». */
    .music-now .music-reflet {
      background: conic-gradient(from 0deg, rgba(0, 0, 0, .4), transparent 40%,
                                 rgba(255, 255, 255, .16), transparent 70%,
                                 rgba(0, 0, 0, .35));
    }
    .music-now .music-axe {
      position: absolute; left: 50%; top: 50%;
      width: 14px; height: 14px; margin: -7px 0 0 -7px;
      border-radius: 999px;
      background: rgba(10, 10, 12, .9);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
    }
    @keyframes music-tourne { to { transform: rotate(360deg); } }

    .music-now .music-texte {
      display: flex; flex-direction: column; gap: 3px;
      min-width: 0;
      opacity: 0; transform: translateX(-16px); filter: blur(4px);
      transition: opacity .16s ease, transform .3s ease, filter .3s ease;
    }
    .widget.visible .music-now .music-texte {
      opacity: 1; transform: translateX(0); filter: blur(0);
      transition: opacity .3s ease .18s,
                  transform .45s cubic-bezier(.2, .9, .2, 1) .18s,
                  filter .4s ease .18s;
    }
    /* L'état en toutes lettres, EN PLUS du mouvement. Le design dit « En
       lecture » ; la pause existe ici et se nomme, parce qu'un équaliseur figé
       ne dit « ça s'est arrêté » qu'à qui l'a vu bouger avant — le viewer qui
       arrive à cet instant ne l'a pas vu. */
    .music-now .music-etat {
      font-family: ui-monospace, "SFMono-Regular", "Consolas", monospace;
      font-size: 10px;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--accent-morceau);
      transition: color .45s ease;
    }
    .music-now .music-titre {
      font-size: 19px; font-weight: 600; letter-spacing: -.01em;
      color: #fff; max-width: 420px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .music-now .music-artiste {
      font-size: 14px; color: var(--accent-doux); max-width: 420px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: color .45s ease;
    }

    /* L'équaliseur : cinq barres qui dansent tant que ça joue, figées en pause.
       Il entre en se dépliant du bas, après le texte. */
    .music-now .music-note {
      display: flex; align-items: flex-end; gap: 3px;
      height: 26px; margin-left: 6px; flex: none;
      transform-origin: bottom;
      opacity: 0; transform: scaleY(.2);
      transition: opacity .14s ease, transform .2s ease;
    }
    .widget.visible .music-now .music-note {
      opacity: 1; transform: scaleY(1);
      transition: opacity .25s ease .26s, transform .35s ease .26s;
    }
    /* Les barres font TOUTE la hauteur et se replient par `scaleY()`, elles ne
       changent pas de `height`. Animer une hauteur relance la mise en page à
       chaque frame — cinq barres, en boucle infinie, tant que la musique passe :
       du travail de layout permanent pour OBS comme pour l'aperçu du panneau de
       mise en scène, qui rend cette page dans une iframe. `transform` et
       `opacity` sont les deux seules propriétés que le compositeur sait animer
       sans rien recalculer. */
    .music-now .music-note i {
      display: block; width: 3px; height: 100%;
      transform: scaleY(.18); transform-origin: bottom;
      background: var(--accent-morceau); border-radius: 2px;
      transition: background .45s ease;
    }
    .music-now.joue .music-note i:nth-child(1) { animation: music-danse .9s ease-in-out infinite; }
    .music-now.joue .music-note i:nth-child(2) { animation: music-danse .7s ease-in-out .15s infinite; opacity: .8; }
    .music-now.joue .music-note i:nth-child(3) { animation: music-danse 1.1s ease-in-out .3s infinite; }
    .music-now.joue .music-note i:nth-child(4) { animation: music-danse .8s ease-in-out .45s infinite; opacity: .8; }
    .music-now.joue .music-note i:nth-child(5) { animation: music-danse 1s ease-in-out .6s infinite; }
    @keyframes music-danse {
      0%, 100% { transform: scaleY(.18); }
      50%      { transform: scaleY(1); }
    }

    /* ── Spam de popups « virus » ─────────────────────────────────────────
       Variante de l'avalanche, à comparer avec elle. Rien ne tombe : les
       fenêtres s'ouvrent de plus en plus vite et RESTENT, jusqu'à l'écran bleu.
       Même parti pris que l'avalanche : `position: fixed` est INTERDIT ici —
       `.widget` porte un `transform`, qui devient le bloc conteneur de tout
       `fixed` descendant. La carte occupe donc le canvas par sa TAILLE. */
    .virus-popup {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
    }
    .virus-popup .vwin {
      position: absolute;
      /* En colonne, avec un corps élastique : la hauteur de la fenêtre est
         posée en pixels par le rendu, et c'est ce qui la rend EXACTE — sans
         quoi elle dépend du ratio de l'image, inconnu au moment de choisir la
         position, et le bas de l'écran reste dégarni. */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #d4d0c8;                /* le gris des vieilles fenêtres */
      border: 2px outset #f0f0f0;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.55);
      font-family: "Tahoma", "Segoe UI", sans-serif;
      /* Elles s'ouvrent d'un coup sec, comme un vrai popup : une entrée douce
         ferait « animation », pas « intrusion ». */
      animation: vwin-pop 120ms ease-out;
    }
    @keyframes vwin-pop {
      from { transform: scale(0.86); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .virus-popup .vwin-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 6px;
      background: linear-gradient(180deg, #0a246a, #3a6ea5);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .virus-popup .vwin-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .virus-popup .vwin-btns { letter-spacing: 2px; flex: none; }
    .virus-popup .vwin-bar { flex: none; }
    .virus-popup .vwin-body {
      flex: 1;
      min-height: 0;                      /* sinon le contenu impose sa taille */
      padding: 12px;
      color: #000;
      font-size: 14px;
    }
    .virus-popup .vwin-msg { display: flex; align-items: center; gap: 10px; }
    .virus-popup .vwin-icon { font-size: 26px; flex: none; }
    .virus-popup .vwin-text { line-height: 1.35; }
    .virus-popup .vwin-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }
    .virus-popup .vwin-btn {
      min-width: 74px;
      padding: 3px 10px;
      text-align: center;
      background: #d4d0c8;
      border: 2px outset #f0f0f0;
      font-size: 13px;
    }
    /* Fenêtre à meme : l'image EST le contenu, le cadre se fait oublier.
       `max-height` n'est pas cosmétique : la hauteur d'un meme dépend de SON
       ratio, que le placement ne connaît pas au moment de tirer la position.
       Sans borne, un meme très haut sortait par le bas — mesuré, quatre
       fenêtres sur soixante-six. Bornée, la fenêtre rétrécit au lieu de
       déborder. */
    .virus-popup .vwin-meme .vwin-body { padding: 4px; text-align: center; }
    .virus-popup .vwin-meme img,
    .virus-popup .vwin-meme video {
      display: block;
      width: 100%;
      height: 100%;
      /* L'image s'adapte à la fenêtre, et non l'inverse : c'est ce qui rend la
         hauteur connue AVANT le chargement, donc le placement juste. */
      object-fit: contain;
    }

    /* L'écran bleu qui clôt le spectacle. Au-dessus de TOUTES les fenêtres —
       leur `z-index` monte avec le rang, le sien est hors d'atteinte. */
    .virus-popup .virus-bsod {
      position: absolute;
      inset: 0;
      z-index: 999;
      background: #0078d7;
      color: #fff;
      font-family: "Segoe UI", "Tahoma", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 12vw;
      gap: 18px;
      animation: bsod-in 220ms ease-out;
    }
    @keyframes bsod-in { from { opacity: 0; } to { opacity: 1; } }
    .virus-popup .bsod-face { font-size: 96px; line-height: 1; }
    .virus-popup .bsod-text { font-size: 34px; line-height: 1.3; max-width: 70%; }
    .virus-popup .bsod-sub { font-size: 22px; opacity: 0.9; }
    /* Le code d'arrêt : c'est LUI qui fait reconnaître un vrai BSOD. */
    .virus-popup .bsod-code {
      font-size: 18px;
      opacity: 0.75;
      font-family: "Consolas", monospace;
      letter-spacing: 0.5px;
    }

    /* L'avatar plonge légèrement en cédant la place, et remonte au retour. */
    /* `animation: none` d'abord : une animation en cours l'emporte sur une
       transition, l'avatar serait resté figé au lieu de céder la place. */
    body.widget-on #avatar-slot > * { animation: none; opacity: 0; transform: translateY(10px) scale(.94); }

    /* Pièce — deux faces, rotation sur Y. Le classique CSS 3D : plus léger
       qu'un moteur, et composé par le GPU. */
    .coin {
      position: relative;
      width: 90px; height: 90px;
      transform-style: preserve-3d;
      /* L'origine en bas fait lire la retombée comme un appui : elle ne change
         rien à `rotateY`, dont l'axe reste vertical et centré. */
      transform-origin: center bottom;
      animation: coin-flip 1.6s linear forwards;
    }
    .coin .face {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      backface-visibility: hidden;
      font-size: 30px; font-weight: 700; color: #3a2c00;
      background: radial-gradient(circle at 34% 30%, #ffe9a8, #e8b93d 55%, #b8860b);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5), inset 0 0 0 4px rgba(255,255,255,.25);
    }
    .coin .tails { transform: rotateY(180deg); }
    /* Le nombre de demi-tours décide de la face visible à l'arrêt :
       pair → pile, impair → face. Piloté par une variable, donc par Wally. */
    /* Une seule courbe pour toute la trajectoire donnait une montée et une
       chute symétriques — ce qui ne ressemble à aucune pièce lancée. Chaque
       palier porte donc la sienne : la montée DÉCÉLÈRE, la chute ACCÉLÈRE, et
       la pièce s'écrase brièvement en se posant avant de reprendre sa forme. */
    @keyframes coin-flip {
      0%   { transform: rotateY(0) translateY(0) scale(1, 1);
             animation-timing-function: cubic-bezier(.08, .55, .3, 1); }
      48%  { transform: rotateY(var(--half-turns-mid)) translateY(-76px) scale(1, 1);
             animation-timing-function: cubic-bezier(.55, 0, .85, .42); }
      88%  { transform: rotateY(var(--half-turns)) translateY(0) scale(1.07, .93);
             animation-timing-function: cubic-bezier(.3, 1.5, .5, 1); }
      100% { transform: rotateY(var(--half-turns)) translateY(0) scale(1, 1); }
    }

    /* Dé — cube à six faces. */
    .die {
      position: relative;
      width: 78px; height: 78px;
      transform-style: preserve-3d;
      animation: die-roll 1.5s cubic-bezier(.3, .1, .2, 1) forwards;
    }
    .die .side {
      position: absolute;
      width: 78px; height: 78px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; color: #1a1a1a;
      background: linear-gradient(150deg, #fdfdfd, #d8d8dc);
      border-radius: var(--r-md);
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .12);
    }
    .die .s1 { transform: rotateY(0deg)   translateZ(39px); }
    .die .s2 { transform: rotateY(90deg)  translateZ(39px); }
    .die .s3 { transform: rotateY(180deg) translateZ(39px); }
    .die .s4 { transform: rotateY(-90deg) translateZ(39px); }
    .die .s5 { transform: rotateX(90deg)  translateZ(39px); }
    .die .s6 { transform: rotateX(-90deg) translateZ(39px); }
    @keyframes die-roll {
      0%   { transform: rotateX(0) rotateY(0) translateY(0); }
      55%  { transform: rotateX(430deg) rotateY(380deg) translateY(-50px); }
      100% { transform: var(--final-rotation) translateY(0); }
    }

    /* Plusieurs dés : alignés, avec leur propre perspective pour que chaque
       cube tourne sur lui-même. */
    .dice-row { display: flex; gap: 14px; perspective: 600px; }

    /* Roue — secteurs colorés, rotation amortie, curseur fixe en haut. */
    /* 220px et non 150 : les intitulés sont maintenant écrits DANS les secteurs,
       et il faut pouvoir les lire par-dessus une image de jeu. */
    .wheel-box { position: relative; width: 220px; height: 220px; }
    /* Le conteneur que spin-wheel remplit de son canvas. Il se dimensionne sur
       lui, d'où la taille explicite plutôt qu'un `height: auto`. */
    .wheel-canvas {
      width: 100%; height: 100%;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, .55));
    }
    .wheel-box .pin {
      position: absolute; top: -9px; left: 50%;
      margin-left: -8px;
      border-width: 0 8px 15px 8px;
      border-style: solid;
      border-color: transparent transparent #fff transparent;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6));
      z-index: 2;
    }
    /* Le résultat ne s'affiche qu'à l'arrêt de la roue (classe posée par
       `onRest`) : le montrer plus tôt vendrait la mèche. */
    .wheel-box .label {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(.86);
      padding: 6px 13px;
      max-width: 150px;
      font-size: 15px; font-weight: 700; color: #fff; text-align: center;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      transition: opacity var(--t-base) var(--ease), transform var(--t-slow) var(--ease-pop);
    }
    .wheel-box .label.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Compte à rebours — anneau de tirets qui s'éteignent, temps au centre.
       Un simple chiffre ne disait pas d'un coup d'œil s'il restait beaucoup. */
    .countdown {
      position: relative;
      width: 220px; height: 220px;
      display: grid; place-items: center;
    }
    .cd-ring { width: 100%; height: 100%; display: block; }
    .cd-seg {
      stroke: #34343c;               /* éteint : le tiret reste visible */
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke var(--t-base) linear;
    }
    .cd-seg.on {
      stroke: var(--on, var(--wally));
      filter: drop-shadow(0 0 3px var(--on, var(--wally)));
    }
    .cd-time {
      position: absolute;
      font-size: 38px; font-weight: 700; color: #fff;
      font-family: ui-monospace, "SFMono-Regular", "Consolas", monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .95);
    }
    .cd-time.tick { animation: tick .45s ease-out; }
    .countdown.done .cd-time { color: var(--lose); font-size: 30px; }
    @keyframes tick {
      0%   { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    /* Jauge d'objectif. */
    .gauge { width: 230px; }
    .gauge .cap {
      margin-bottom: 5px;
      font-size: 14px; font-weight: 600; color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .95);
    }
    .gauge .track {
      height: 17px;
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .gauge .fill {
      height: 100%;
      /* Pleine largeur puis comprimée : `transform` est composé par le GPU,
         là où `width` refaisait la mise en page à chaque image. La barre
         continue de glisser même quand le thread principal hoquette — ce qui
         arrive précisément quand un lot d'événements SSE tombe. */
      width: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--info), var(--who-deep));
      border-radius: var(--r-md);
      transition: transform 1.1s cubic-bezier(.2, .7, .3, 1);
    }

    /* Message du chat épinglé — c'est Wally qui choisit lequel mérite l'écran. */
    .pinned {
      max-width: 290px;
      padding: 9px 13px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-left: 3px solid var(--who-deep);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .pinned .who { font-size: 12px; font-weight: 700; color: var(--who); }
    .pinned .msg { font-size: 15px; line-height: 1.3; }

    /* Sondage — les viewers votent en tapant le numéro dans le chat. */
    .poll {
      width: 260px;
      padding: 10px 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .poll .q {
      margin-bottom: 8px;
      font-size: 15px; font-weight: 700;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .poll .q .left { font-size: 13px; color: var(--who); font-variant-numeric: tabular-nums; }
    /* Options : arrivée en cascade, ~60 ms d'écart — le regard descend la liste
       au lieu de la découvrir d'un bloc. */
    .poll .opt {
      margin-bottom: 6px;
      font-size: 13px;
      /* `backwards` (et NON `forwards`) : l'état initial s'applique pendant le
         délai, mais l'animation ne fige rien après coup — sinon elle écraserait
         l'estompage des perdants, qui est une simple propriété. */
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 60ms + 120ms);
    }
    @keyframes opt-in {
      from { opacity: 0; transform: translateX(10px); }
    }

    /* Le chiffre qui vient de bouger tressaille : on voit QUI prend le vote. */
    .poll .count { display: inline-block; }
    .poll .count.bump { animation: count-bump .32s ease-out; }
    @keyframes count-bump {
      0%   { transform: scale(1);   color: #fff; }
      35%  { transform: scale(1.22); color: var(--win); }
      100% { transform: scale(1);   color: #fff; }
    }

    /* Sablier : une seule animation linéaire, donc fluide en continu, là où le
       décompte en secondes saute d'un cran à la fois. */
    .poll .timer {
      height: 3px;
      margin: 2px 0 8px;
      background: rgba(255, 255, 255, .08);
      border-radius: var(--r-xs);
      overflow: hidden;
    }
    .poll .timer span {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, var(--who), var(--info));
      animation: timer-drain linear forwards;
      animation-duration: var(--dur, 0s);
    }
    @keyframes timer-drain { to { transform: scaleX(0); } }
    /* Sondage clos : le sablier s'arrête net plutôt que de continuer à courir. */
    .poll.final .timer span { animation: none; transform: scaleX(0); }

    .poll .opt { margin-bottom: 6px; font-size: 13px; }
    .poll .opt .row { display: flex; justify-content: space-between; margin-bottom: 2px; }
    /* Gagnant, une fois le décompte terminé. Teinte + graisse plutôt qu'un cadre
       supplémentaire : plus lisible dans un widget de 250 px. */
    .poll .opt.win .row { color: var(--win); font-weight: 700; }
    .poll .opt.win .bar span { background: linear-gradient(90deg, var(--win-deep), var(--win)); }
    /* À la clôture : le gagnant pulse une fois, les perdants reculent. */
    .poll.final .opt.win { animation: win-pop .5s cubic-bezier(.22, 1.5, .4, 1); }
    .poll.final .opt.lose { opacity: .45; transition: opacity var(--t-slow) var(--ease); }
    @keyframes win-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .poll .bar {
      height: 9px;
      background: rgba(255, 255, 255, .1);
      border-radius: var(--r-sm);
      overflow: hidden;
    }
    .poll .bar span {
      display: block; height: 100%; width: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--info), var(--who-deep));
      border-radius: var(--r-sm);
      transition: transform .45s cubic-bezier(.3, .9, .3, 1), background var(--t-base) var(--ease);
    }

    /* Classement des bavards — mécanique, donc sobre. */
    .talkers {
      width: 260px;
      padding: 11px 13px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .talkers-title {
      font-family: var(--display);
      font-size: 13.5px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--dim); margin-bottom: 8px;
    }
    .talker {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 14px; margin-bottom: 5px;
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 90ms + 100ms);
    }
    .talker .pos { width: 22px; flex: 0 0 22px; }
    .talker .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .talker .n { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--who); }
    .talker.rank1 .who { color: var(--gold); font-weight: 700; }

    /* Clip — l'auteur compte autant que le titre : c'est lui qu'on récompense. */
    .clip {
      width: 300px;
      padding: 11px 13px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-left: 3px solid var(--info);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      animation: wave-in .5s cubic-bezier(.22, 1.4, .4, 1);
    }
    .clip-head {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--info); margin-bottom: 5px;
    }
    .clip-title { font-size: 14px; line-height: 1.3; }
    .clip-author { margin-top: 5px; font-size: 12px; color: var(--dim); }

    /* Clip joué : la vidéo prend la largeur utile de la source OBS (560 px),
       en 16:9. Le padding de la carte disparaît — un liseré autour d'une vidéo
       ne sert à rien et mange de la place. */
    .clip.playing {
      width: 540px;
      padding: 0;
      overflow: hidden;
      border-left-width: 1px;
    }
    /* Le conteneur réserve la place AVANT que l'iframe n'arrive (elle n'est
       montée qu'une fois le widget visible, cf. l'autoplay de Twitch) : sans
       hauteur fixe, le widget sauterait de 0 à 304 px sous les yeux. */
    .clip-frame {
      display: block;
      width: 540px;
      height: 304px;          /* 16:9 */
      background: #000;
      border: 0;
    }
    .clip-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    .clip-video {
      display: block;
      width: 540px;
      height: 304px;          /* 16:9 */
      background: #000;
      object-fit: contain;    /* un clip vertical n'est pas déformé */
    }
    /* Lecture impossible : on n'impose pas un cadre noir muet aux viewers. */
    .clip.clip-failed .clip-video { display: none; }
    .clip-credit {
      padding: 6px 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, .72);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Vague d'emote — elle surgit et repart : c'est un éclat, pas un panneau. */
    /* Raid — le nom de celui qui débarque, en grand. La carte doit tenir tête
       aux confettis qui traversent l'écran derrière elle, d'où le fond plus
       opaque et la bordure dorée. */
    .raid {
      padding: 14px 26px;
      background: var(--glass);
      border: 1px solid rgba(255, 209, 102, .45);
      border-radius: var(--r-lg);
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      box-shadow: 0 4px 24px rgba(255, 209, 102, .16);
      animation: raid-in .55s cubic-bezier(.22, 1.5, .4, 1);
    }
    .raid-tag {
      font-family: var(--display);
      font-size: 12.5px; letter-spacing: .18em;
      color: var(--gold); margin-bottom: 4px;
    }
    .raid-name {
      font-family: var(--display);
      font-size: 29px; letter-spacing: .01em; line-height: 1.1;
      /* Un pseudo long est déjà borné côté serveur, mais un mot sans espace
         peut encore déborder : il se coupe plutôt que d'élargir la carte. */
      max-width: 380px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .raid-count {
      margin-top: 5px; font-size: 12.5px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }
    @keyframes raid-in {
      0%   { transform: scale(.72) translateY(14px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .wave {
      padding: 10px 18px;
      background: var(--glass);
      border: 1px solid rgba(255, 176, 102, .35);
      border-radius: var(--r-lg);
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      animation: wave-in .5s cubic-bezier(.22, 1.5, .4, 1);
    }
    .wave-emote {
      font-size: 26px; font-weight: 800; color: var(--wally);
      letter-spacing: .02em;
    }
    .wave-label {
      font-family: var(--display);
      margin-top: 2px; font-size: 13px; text-transform: uppercase;
      letter-spacing: .06em; color: var(--dim);
    }
    @keyframes wave-in {
      0%   { transform: scale(.6) rotate(-4deg); opacity: 0; }
      60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* Citation — le guillemet et l'italique disent « quelqu'un a dit ça »
       avant même qu'on ait lu la phrase. */
    .quote {
      position: relative;
      width: 300px;
      padding: 14px 16px 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-left: 3px solid var(--wally);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .quote-mark {
      position: absolute; top: -6px; left: 10px;
      font-size: 42px; line-height: 1;
      color: rgba(255, 176, 102, .35);
      font-family: Georgia, serif;
    }
    .quote-text {
      position: relative;
      font-size: 15px; line-height: 1.35; font-style: italic;
      /* La phrase se révèle d'un bloc, l'auteur juste après : on lit la
         réplique avant de savoir qui l'a dite, comme une chute. */
      animation: opt-in .4s cubic-bezier(.22, 1.3, .4, 1) backwards;
    }
    .quote-author {
      margin-top: 8px; font-size: 12px; text-align: right;
      color: var(--dim);
      animation: opt-in .4s cubic-bezier(.22, 1.3, .4, 1) .45s backwards;
    }

    /* Pendu — le dessin porte l'information : on voit la partie se dégrader
       sans lire un compteur. */
    .hangman {
      display: flex; align-items: center; gap: 14px;
      width: 400px;
      padding: 12px 14px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .gallows { width: 96px; height: 104px; flex: 0 0 96px; }
    .gallows .post {
      stroke: var(--dimmer); stroke-width: 4; stroke-linecap: round;
    }
    /* Chaque membre se TRACE : un trait qui surgit ne se remarque pas. */
    .gallows .part {
      stroke: var(--lose); stroke-width: 4; stroke-linecap: round; fill: none;
      stroke-dasharray: 120; stroke-dashoffset: 120;
      animation: draw-part .45s ease-out forwards;
      animation-delay: calc(var(--i, 0) * 40ms);
    }
    @keyframes draw-part { to { stroke-dashoffset: 0; } }

    .hangman-side { flex: 1; min-width: 0; }
    .hangman-hint {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--dim); margin-bottom: 8px;
    }
    .hangman-word { display: flex; flex-wrap: wrap; gap: 5px; }
    .hangman-word .slot {
      width: 20px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700; text-transform: uppercase;
      border-bottom: 2px solid rgba(255, 255, 255, .3);
    }
    /* La lettre trouvée tombe en place au lieu d'apparaître. */
    .hangman-word .slot.filled {
      color: var(--win); border-bottom-color: rgba(125, 255, 176, .5);
      animation: slot-drop .32s cubic-bezier(.22, 1.4, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 35ms);
    }
    @keyframes slot-drop {
      from { opacity: 0; transform: translateY(-8px) scale(.8); }
    }
    .hangman-missed {
      margin-top: 8px; font-size: 12px; letter-spacing: .16em;
      color: var(--lose); text-decoration: line-through;
    }
    .hangman-help {
      margin-top: 8px; font-size: 11.5px; color: var(--dimmer);
    }
    .hangman-verdict {
      margin-top: 8px; font-size: 14px; font-weight: 700;
      animation: win-pop .5s cubic-bezier(.22, 1.5, .4, 1);
    }
    .hangman.won  .hangman-verdict { color: var(--win); }
    .hangman.lost .hangman-verdict { color: var(--lose); }

    /* Chifoumi — le geste du vrai jeu : les mains secouent trois fois avant de
       se figer sur le coup joué. Sans ce battement, le résultat tombe sans
       suspense et le widget n'a plus d'intérêt. */
    .rps {
      width: 320px;
      padding: 12px 14px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .rps-title {
      font-family: var(--display);
      font-size: 14px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--dim); margin-bottom: 10px;
    }
    .rps-hand { font-size: 38px; line-height: 1; }

    /* Duel */
    .rps-duel { display: flex; align-items: center; justify-content: center; gap: 18px; }
    .rps-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    /* Le pseudo peut être long : il se coupe plutôt que d'écarter les mains. */
    .rps-name {
      font-size: 11.5px; color: var(--dim);
      max-width: 120px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .rps-vs {
      font-family: var(--display);
      font-size: 16px; letter-spacing: .06em;
      color: var(--dimmer);
      animation: vs-pulse 1.2s ease-in-out infinite;
    }
    @keyframes vs-pulse {
      0%, 100% { opacity: .35; transform: scale(1); }
      50%      { opacity: .8;  transform: scale(1.12); }
    }
    /* UNE seule animation, et c'est délibéré : la version d'avant en empilait
       deux (`rps-shake` puis `rps-land`) qui animaient toutes les deux
       `transform`. La dernière déclarée l'emporte, et comme `rps-land` était en
       `backwards`, son `scale(1.35)` s'appliquait pendant tout le délai — la
       secousse ne s'est donc JAMAIS vue, il ne restait qu'un zoom.
       Toute phase supplémentaire doit entrer dans ces keyframes, pas à côté. */
    .rps-duel .rps-hand {
      animation: rps-throw 1.25s cubic-bezier(.33, 0, .3, 1) backwards;
    }
    /* Les deux mains partent ENSEMBLE : au chifoumi on compte à deux. Les
       décaler donnait l'impression que l'un attendait de voir l'autre. */
    @keyframes rps-throw {
      /* Trois battements verticaux — le geste réel du jeu, « pierre, feuille,
         ciseaux » scandé en abaissant le poing. */
      0%, 23%, 45%, 68% { transform: translateY(0) scale(1); }
      11%, 34%, 57%     { transform: translateY(-18px) scale(1.04); }
      /* Le coup se pose : il tombe plus bas que sa place, puis remonte. */
      84%               { transform: translateY(3px) scale(1.2); }
      100%              { transform: translateY(0) scale(1); }
    }
    .rps-verdict {
      margin-top: 10px; font-size: 15px; font-weight: 700;
      /* Après les 1,25 s de lancer : le verdict ne doit pas tomber avant que
         les deux mains soient posées. */
      animation: opt-in .4s cubic-bezier(.22, 1.3, .4, 1) 1.35s backwards;
    }
    .rps.opponent .rps-verdict { color: var(--win); }
    .rps.wally    .rps-verdict { color: var(--wally); }
    .rps.draw     .rps-verdict { color: var(--dim); }

    /* Meme de la communauté — l'image seule, sans légende : sa description est
       le contexte que Wally lit pour le commenter, pas un texte à afficher.
       Bornée en hauteur : une image verticale sortirait du cadre. */
    /* Même boîte imposée que le rotateur, et pour la même raison. Ici l'écart
       était pire : le repère du panneau annonçait 720 × 540 pendant que le CSS
       bornait à 380 × 260 — deux chiffres écrits à deux endroits, qui ne se
       parlaient pas. Le rectangle qu'on manipulait faisait trois fois et demie
       la surface du meme qui s'affichait. Les dimensions viennent maintenant de
       `WallyLayout.taille("meme")`, posées par `overlay.js`. */
    .meme {
      width: var(--meme-zone-l, 400px);
      height: var(--meme-zone-h, 400px);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
    }
    .meme img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto; height: auto;
      object-fit: contain;
      border-radius: var(--r-sm);
    }

    /* Planning des streams — ce sont des horaires : ils doivent être LISIBLES,
       pas devinés. À côté de l'avatar il ne reste que 326 px de large, où une
       image de 1280 tomberait à 308 px — un quart de sa taille. La carte prend
       donc toute la source le temps de son affichage ; l'avatar, effacé par
       `body.widget-on`, réapparaît juste après.

       Elle occupe le cadre par la TAILLE de son image, pas par un positionnement
       hors flux : `.widget` porte un `transform` (l'animation d'entrée), et un
       ancêtre transformé devient le bloc conteneur de tout `position: fixed`
       descendant. Le `fixed` initial ne visait donc pas la source mais un
       `.widget` sans hauteur — faute d'enfant dans le flux —, et la carte
       s'affichait en 16 x 16 px hors cadre : invisible. Même patron que `.meme`,
       aux dimensions près. */
    .planning {
      max-width: 100%;
      padding: 8px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
    }
    .planning img {
      display: block;
      /* Les 40 px retranchés : une marge de 12 px de chaque côté (l'ancien
         `#widgets` la posait, le conteneur d'élément la laisse au modèle), plus
         les 8 px de padding de la carte. Mesuré sur la source réelle
         (526 x 296), l'image fait alors 455 px de large. */
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 40px);
      width: auto; height: auto;
      border-radius: var(--r-sm);
    }

    /* Pari de Wally — ouverture, puis verdict. */
    .prediction {
      width: 280px;
      padding: 11px 13px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-left: 3px solid var(--who);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .prediction.right { border-left-color: var(--win); }
    .prediction.wrong { border-left-color: var(--lose); }
    .pred-head {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--dim); margin-bottom: 5px;
    }
    .prediction.right .pred-head { color: var(--win); font-weight: 700; }
    .prediction.wrong .pred-head { color: var(--lose); font-weight: 700; }
    .pred-bet { font-size: 14px; line-height: 1.3; }
    .prediction.wrong .pred-bet { text-decoration: line-through; opacity: .7; }
    .pred-score {
      margin-top: 7px; font-size: 12px; font-variant-numeric: tabular-nums;
      color: var(--dim);
    }

    /* Bingo du stream — liste plutôt que grille : à 200 px, une grille 3×3
       serait illisible. Les viewers regardent les cases se cocher. */
    .bingo {
      /* Vraie grille : la place le permet, l'avatar et la bulle s'effacent. */
      width: 420px;
      max-width: 100%;
      padding: 10px 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .bingo-title {
      font-family: var(--display);
      font-size: 14px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--dim); margin-bottom: 8px;
    }
    .bingo.full .bingo-title {
      color: var(--win); font-weight: 800; letter-spacing: .12em;
      animation: win-pop .6s cubic-bezier(.22, 1.5, .4, 1);
    }
    /* 3 colonnes tant qu'il y a assez de cases, sinon autant que nécessaire. */
    .bingo .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .bingo.few .grid { grid-template-columns: repeat(2, 1fr); }
    .bingo .cell {
      display: flex; gap: 6px; align-items: flex-start;
      min-height: 46px; padding: 6px 7px;
      font-size: 12px; line-height: 1.2;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: var(--r-sm);
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 55ms + 100ms);
    }
    .bingo .mark {
      width: 11px; flex: 0 0 11px; color: var(--win); font-weight: 700;
    }
    .bingo .cell.done {
      background: rgba(52, 209, 127, .12);
      border-color: rgba(125, 255, 176, .3);
    }
    .bingo .cell.done .txt {
      color: var(--dim);
      text-decoration: line-through;
    }
    /* La case qu'on vient de cocher : sinon on ne voit pas ce qui a changé. */
    .bingo .cell.just .txt { color: var(--win); text-decoration: none; font-weight: 700; }
    .bingo .cell.just { animation: win-pop .5s cubic-bezier(.22, 1.5, .4, 1); }

    /* Stats d'un joueur — les chiffres viennent de l'API, pas du modèle. */
    .stats, .versus {
      width: 260px;
      padding: 10px 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    }
    .stats .who {
      font-size: 14px; font-weight: 700; margin-bottom: 7px;
      color: var(--wally);
    }
    .stats .line {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 13px; margin-bottom: 4px;
      /* Même cascade que le sondage : les lignes se posent l'une après l'autre. */
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 70ms + 120ms);
    }
    /* Panneaux Apex — ils empruntent la carte de `.stats`, avec ce qu'il faut
       en plus : l'image du rang, l'état en jeu, un décompte qui tourne. */
    .apex .apex-rank-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .apex .apex-rank-img { width: 34px; height: 34px; object-fit: contain; }
    /* Un graphe n'est pas une liste de valeurs : la carte de `.stats` fait
       260 px, et la courbe s'y retrouvait dessinée à 234 px — 23 % de sa taille
       native, heures et durées illisibles à l'écran. Elle prend donc les 560 px
       de large utiles de la source OBS, bornés à ce que la source offre
       vraiment pour qu'une source étroite ne la fasse pas déborder. */
    .apex.apex-large { width: min(560px, calc(100vw - 24px)); }
    .apex .apex-progress-img { width: 100%; display: block; border-radius: var(--r-sm); }
    .apex .apex-rank-name { font-size: 15px; font-weight: 700; }
    .apex .apex-avatar {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
      float: right; margin: -26px 0 0 0;
    }
    .apex .apex-state {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--dim); margin-bottom: 8px;
    }
    .apex .apex-state.live { color: var(--win); }
    .apex .apex-world { font-size: 11px; color: var(--wally); margin-left: 6px; }
    .apex .apex-timer {
      font-size: 11px; color: var(--dim);
      margin-left: 6px; font-variant-numeric: tabular-nums;
    }
    .apex .apex-up .v { color: var(--win); }
    .apex .apex-down .v { color: var(--lose); }
    .cliptop { width: 320px; }
    .cliptop .cliptop-row { margin-bottom: 6px; }
    .cliptop .line { margin-bottom: 0; }
    .cliptop .line .k { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cliptop .cliptop-by { font-size: 11px; color: var(--dimmer); }
    .stats .line .k { color: var(--dim); }
    .stats .line .v { font-weight: 700; font-variant-numeric: tabular-nums; }

    /* Comparaison — barres relatives au meilleur des deux. */
    .versus .vs-label {
      font-family: var(--display);
      font-size: 14px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--dim); margin-bottom: 8px;
    }
    .versus .vs-row {
      margin-bottom: 8px; font-size: 13px;
      animation: opt-in .34s cubic-bezier(.22, 1.2, .4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 90ms + 140ms);
    }
    .versus .vs-row .row {
      display: flex; justify-content: space-between; margin-bottom: 3px;
      font-variant-numeric: tabular-nums;
    }
    .versus .vs-row.lead .row { color: var(--win); font-weight: 700; }
    /* Sous-titre d'un camp : légende jouée et niveau. Discret — c'est le score
       qui se lit, pas le détail. */
    .versus .vs-sub {
      font-size: 11px;
      opacity: .6;
      margin-top: 1px;
      margin-bottom: 3px;
    }
    .versus .bar {
      height: 9px; border-radius: var(--r-sm); overflow: hidden;
      background: rgba(255, 255, 255, .1);
    }
    .versus .bar span {
      display: block; height: 100%; width: 100%; border-radius: var(--r-sm);
      transform: scaleX(0);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--info), var(--who-deep));
      transition: transform .6s cubic-bezier(.3, .9, .3, 1);
    }
    .versus .vs-row.lead .bar span {
      background: linear-gradient(90deg, var(--win-deep), var(--win));
    }
    /* Le chiffre qui vient de bouger tressaille : on voit QUI vient de faire un
       kill. Même animation que le sondage. Décalé jusqu'après l'entrée de sa
       ligne — sinon il tressaille pendant qu'elle glisse encore, et personne
       ne le voit. */
    .versus .count { display: inline-block; }
    .versus .count.bump {
      animation: count-bump .32s ease-out;
      animation-delay: calc(var(--i, 0) * 90ms + 480ms);
      animation-fill-mode: backwards;
    }
    /* Clôture du duel — le gagnant pulse, le perdant s'estompe à 45 %. C'est
       exactement la fin du sondage, et c'est le CONTRASTE qui dit que c'est
       fini : en cours de duel, personne n'est vert et personne n'est éteint.
       La ligne du gagnant garde son entrée en cascade — la remplacer par la
       seule pulsation la priverait d'arrivée, l'autre ligne glissant sans
       elle. */
    .versus.final .vs-row.lead {
      animation:
        opt-in .34s cubic-bezier(.22, 1.2, .4, 1) calc(var(--i, 0) * 90ms + 140ms) backwards,
        win-pop .5s cubic-bezier(.22, 1.5, .4, 1) calc(var(--i, 0) * 90ms + 480ms) backwards;
    }
    .versus.final .vs-row.lose {
      opacity: .45;
      transition: opacity var(--t-slow) var(--ease);
    }

    /* Compteur (uptime) — texte simple, lisible sur tout fond. */
    .counter {
      padding: 9px 16px;
      font-size: 26px; font-weight: 600; color: #fff;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
      font-variant-numeric: tabular-nums;
    }

    /* ── Rotateur de memes ─────────────────────────────────────────────────
       Porté de `overlay_rotation.html`, qui tenait SEUL dans sa propre source
       OBS : ses bornes y étaient donc en `100vw`/`100vh`. Ici la zone est
       placée comme les autres — position, ancrage, échelle —, et les bornes
       sont en pixels du canvas de référence. Elles sont posées par `overlay.js`
       depuis `WallyLayout.taille("rotator")`, pour qu'UN seul chiffre gouverne
       à la fois le repère de placement et le rendu réel.

       Passe-partout sombre : la plupart des memes sont sur fond blanc, et sur
       un overlay noir ça fait une dalle plus lumineuse que le reste de l'écran.
       Le liseré casse le contact entre ce blanc et la bordure orange. */
    .rotateur {
      /* LA BOÎTE EST IMPOSÉE, elle n'épouse plus le média. Auparavant le cadre
         prenait la taille du meme affiché : l'encombrement changeait à chaque
         rotation, et le repère du panneau — qui doit bien annoncer UN rectangle
         — ne pouvait qu'avoir tort. Les dimensions viennent de
         `WallyLayout.taille("rotator")`, posées par `overlay.js` : le repère et
         le rendu lisent le même chiffre.
         Le prix, assumé : un meme très allongé ou très haut laisse du
         passe-partout sur les côtés. C'est le fond sombre déjà là, et le cadre
         cesse de sauter d'une taille à l'autre toutes les quelques secondes. */
      width: var(--rotateur-zone-l, 400px);
      height: var(--rotateur-zone-h, 400px);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(8, 6, 5, .94);
      border: 3px solid #ff7a2f;
      border-radius: var(--r-lg);
      box-shadow:
        0 0 24px rgba(255, 122, 47, .6),
        inset 0 0 30px rgba(0, 0, 0, .9),
        0 18px 45px rgba(0, 0, 0, .8);
      /* Éteint au départ : la boucle l'allume par une rafale de glitch. Une
         source qui naît avec un cadre vide allumé se voit à l'antenne. */
      opacity: 0;
      line-height: 0;
      /* Rien ne doit dépasser des coins arrondis, sinon l'angle droit du média
         réapparaît derrière eux. Porté par le CADRE et non par
         `[data-element]` : un `overflow` sur un conteneur de placement rogne
         les pseudo-éléments qu'il contient — la pointe de la bulle en a fait
         les frais pendant des semaines. */
      overflow: hidden;
    }
    /* Le média se range dans la boîte : `100 %` de l'espace intérieur, que le
       `box-sizing` a déjà amputé du passe-partout et de la bordure. Un seul
       chiffre gouverne donc les deux, et il n'y a plus de `686px` écrit ici qui
       puisse dériver de la table.
       L'agrandissement des petits memes reste calculé en JS (plafonné à ×2) —
       les étirer à la boîte coûte que coûte les ferait baver. */
    .rotateur img, .rotateur video {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto; height: auto;
      object-fit: contain;
      border-radius: var(--r-sm);
    }
    /* `.rotateur .absent` et non `.absent` seul : la règle au-dessus vise
       `.rotateur video`, qui l'emporterait. Sans ce poids, la balise vidéo vide
       restait affichée et ajoutait ses 150 px de hauteur par défaut sous chaque
       image. */
    .rotateur .absent { display: none; }

    /* ── Image de la galerie ───────────────────────────────────────────────
