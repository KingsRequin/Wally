; Vérification de types en mode GRADUEL.
;
; Le projet a 44 000 lignes écrites sans annotations complètes : exiger un
; typage strict aujourd'hui produirait des milliers d'erreurs et personne ne les
; lirait. Ce réglage vise l'inverse — un signal court, lisible, et un cliquet qui
; empêche la dette de croître (cf. scripts/lint_types.py).
;
; La valeur est prouvée : plusieurs défauts des audits du 2026-08-10 étaient de
; pures erreurs de type que mypy voit sans exécuter une ligne —
; `get_active_action_tasks` annoncé `list[dict]` alors qu'il rendait des
; `sqlite3.Row` (le bot ne démarrait plus), `facts[True]` comme index,
; `.get()` sur une valeur qui pouvait être None.

[mypy]
python_version = 3.11
ignore_missing_imports = True
; On ne DEMANDE pas d'annotations : on vérifie celles qui existent déjà.
disallow_untyped_defs = False
check_untyped_defs = True
warn_unused_ignores = True
show_error_codes = True
exclude = (?x)(^tests/|^scripts/)

; Bibliothèques tierces sans stubs : leur absence de types n'est pas notre dette.
[mypy-discord.*]
ignore_errors = True

[mypy-twitchio.*]
ignore_errors = True

[mypy-webrtcvad.*]
ignore_errors = True
