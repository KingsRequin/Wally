  nom: Le care package
  court: CARE PACKAGE
  type: action
  categorie: ressource
  visuel: /assets/cartes/carte-care-package.svg
  forme: image
  regle: >-
    Pioche ${cartes} cartes, garde-en ${gardees}, et remélange les autres
    AU HASARD dans ta pioche.
  stats:
    cartes: 3
    gardees: 1

- cle: de_l_air
  nom: De l'air
  court: DE L'AIR
  type: action
  categorie: ressource
  visuel: /assets/icones/lungs.svg

- cle: shop_loba
  nom: Le shop de Loba
  court: SHOP DE LOBA
  type: action
  categorie: ressource
  visuel: /assets/cartes/carte-shop-loba.svg
  forme: image
  regle: Prends UNE CARTE AU HASARD dans la main de l'adversaire.

- cle: drone_crypto
  nom: Le drone de Crypto
  court: DRONE
  type: action
  categorie: ressource
  visuel: /assets/cartes/carte-drone-crypto.svg
  forme: image
  regle: Regarde la main de l'adversaire jusqu'à la fin du tour.

- cle: typical_octane
  nom: Typical Octane
  court: TYPICAL OCTANE
  type: action
  categorie: ressource
  visuel: /assets/cartes/carte-typical-octane.svg
  forme: image
  face_cachee: true
  regle: >-
    La prochaine fois que l'adversaire pioche, C'EST TOI QUI PRENDS LA CARTE.

- cle: pp_samedi
  nom: Les PP du samedi
  court: PP DU SAMEDI
  type: action
  categorie: ressource
  visuel: /assets/icones/dozen.svg
