- cle: feur
  nom: Quoi → FEUR
  court: FEUR
  type: action
  categorie: controle
  # Une carte dont la vanne EST un mot ne gagne rien à un pictogramme : « FEUR »
  # n'a pas d'objet à dessiner, il a une réplique. Le mot prend donc la place
  # de l'illustration, pas celle du titre.
  texte: FEUR
  regle: Annule la prochaine tactique jouée par l'adversaire ce tour.

