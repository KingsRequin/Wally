# Les cartes ACTION et PASSIF du TCG du Purgatoire — la source unique.
#
# Pendant de `tcg/cartes.yaml`, qui ne porte que les HÉROS. Même régime : ce
# fichier est LA donnée, `bot/core/tcg_cartes_action.py` n'en est que le
# lecteur, il est bind-monté (`./tcg:/app/tcg:ro`) et lu au BOOT — le corriger
# demande un `docker compose restart wally`, pas un rebuild.
#
# 🚨 CE FICHIER SUIT LE DESIGN, qui suit Notion. Le recto des cartes est figé
# dans le projet Claude Design « Conception plateau TCG Wally »
# (`Cartes Tactique.dc.html`), et c'est de là que viennent le `type`, la
# `categorie` et le `visuel`. Relevé du 2026-09-12 figé dans
# `/opt/design-tcg/import-2026-09-12/catalogue-cartes-action-passif.tsv`.
#
# 🚨 `cout: 0` NE VEUT PAS DIRE GRATUIT, il veut dire NON CALIBRÉ.
# Arbitrage de l'owner du 2026-09-12 : « on ne peut pas mettre de coût alors
# que les cartes ne sont pas terminées, le coût est en rapport avec la
# puissance de la carte, faut attendre que tout soit fini ». Les 46 cartes
# sont donc à 0 aujourd'hui, et la page l'écrit en toutes lettres plutôt que
# d'afficher un chiffre que personne n'a décidé.
#
# 🚨 `regle: INDÉFINI` se lit tel quel sur la carte. 28 des 46 règles ne sont
# pas écrites ; aucune valeur de remplissage n'est servie « en attendant ».
# Un placeholder qui ressemble à une donnée finit par être lu comme une donnée.
#
# ⚠️ Le `type` tient le CADRE de la carte, la `categorie` tient le BANDEAU du
# haut. Deux dimensions, jamais mélangées : une carte de soin passive et une
# carte de soin active partagent le vert et rien d'autre.
#
# ⚠️ L'or est RÉSERVÉ à la pastille de coût — aucune catégorie ne le porte.
# L'Aura était or dans le premier jet, elle est passée en baie pour ça : deux
# choses différentes de la même couleur au même endroit se lisent comme la
# même chose.
#
# ⚠️ `visuel` porte l'extension, CONTRAIREMENT aux héros : ce sont des SVG
# servis tels quels, il n'y a pas de paire AVIF + repli WebP à composer. Le
# lecteur VÉRIFIE que le fichier existe sur le disque — une carte au pochoir
# mort serait un cadre vide annoncé comme illustré.
#
# ⚠️ `groupe: 3` = carte À REGROUPER : elle compte pour UNE carte du deck mais
# en donne trois à la table. Le rendu en tire trois exemplaires numérotés plus
# la carte complète — cf. le §4 de
# `docs/superpowers/specs/2026-09-05-tcg-tactiques-saison-1.md`.
#
# ⚠️ Deux cartes partagent volontairement le même pochoir — `Le tunnel de
# Rina` et `Requin qui tente d'expliquer` (owner, 2026-09-12). Ce n'est pas un
# oubli, ne pas le « corriger ».

# ── Attaque ───────────────────────────────────────────────────────────────
- cle: camion_raiky
  nom: Le camion de Raiky
  court: CAMION
  type: action
  categorie: attaque
  visuel: /assets/icones/flatbed-covered.svg
  regle: >-
    Reste sur le plateau, FACE VISIBLE, et se relance à chaque tour. Elle
    blesse un héros adverse, puis un des tiens, tiré au hasard,
    encaisse le contrecoup. Le risque et le contrecoup montent à chaque
    utilisation et ne redescendent JAMAIS de la partie.

- cle: cluster
  nom: Le cluster
  court: CLUSTER
  type: action
  categorie: attaque
  visuel: /assets/icones/laser-sparks.svg
  regle: >-
    Tu ne choisis AUCUNE cible. Elle frappe un héros adverse tiré au hasard,
    puis rebondit sur un autre, tiré au hasard lui aussi, et ainsi de suite
    en faisant moins de dégâts à chaque rebond. Elle s'arrête au premier
    rebond raté.

- cle: mozambique
  nom: Mozambique here!
  court: MOZAMBIQUE
  type: passif
  categorie: attaque
  visuel: /assets/cartes/carte-mozambique.png
  forme: image
  regle: >-
    Reste sur le plateau, FACE VISIBLE, et peut donc être détruite. Tant
    qu'elle y est, TOUT LE MONDE est en RAGE — tes héros comme ceux d'en
    face : chacun a une chance d'infliger un coup critique.

- cle: baril_caustique
  nom: Le baril de Caustique
  court: BARIL
  type: action
  categorie: attaque
  visuel: /assets/cartes/carte-baril-caustique.png
  forme: image
  face_cachee: true
  regle: >-
    ${degats} dégât à TOUS les héros — les tiens compris — au début de chacun
    des ${tours} prochains tours.
  stats:
    degats: 1
    tours: 3

- cle: aim_assist
  nom: Aim assist = aimbot
  court: AIM ASSIST
  type: passif
  categorie: attaque
  visuel: /assets/icones/human-target.svg
  regle: >-
    Tant qu'elle est en jeu, les héros adverses ne peuvent plus esquiver :
    leurs chances d'esquive tombent à zéro.

- cle: stim_octane
  nom: Le stim d'Octane
  court: STIM
  type: action
  categorie: attaque
  visuel: /assets/cartes/carte-stim-octane.png
  forme: image
  regle: >-
    Un héros allié perd ${pv} PV et gagne +${attaque} d'Attaque ce tour.
  stats:
    pv: 2
    attaque: 4

- cle: flatline_azrael
  nom: vous avez vu mon skin de flatline ?
  court: FLATLINE
  type: passif
  categorie: attaque
  visuel: /assets/cartes/carte-flatline.png
  forme: image
  regle: >-
    À la pose, ajoute de l'Aura à un de tes héros tiré au hasard. Si ce héros
    meurt, la carte est détruite avec lui.

- cle: manette
  nom: La manette
  court: MANETTE
  type: passif
  categorie: attaque
  visuel: /assets/icones/console-controller.svg
  regle: >-
    Tant qu'elle est en jeu, TES héros ont une chance d'infliger un coup
    critique.

- cle: tenma
  nom: Tenma
  court: TENMA
  type: passif
  categorie: attaque
  visuel: /assets/icones/speedometer.svg
  regle: >-
    Tant qu'il ne te reste qu'UN SEUL héros vivant, sa chance d'esquive est
    fortement accrue.

- cle: codage_requin
  nom: Codage à la Requin
  court: CODAGE
  type: action
  categorie: attaque
  visuel: /assets/icones/pc.svg
  regle: >-
    Reste sur le plateau et se relance à chaque tour, elle ne se défausse
    jamais. Elle a ${chance} de blesser un héros adverse ; sinon c'est un des
    TIENS, tiré au hasard, qui prend la MOITIÉ de ces dégâts.
  stats:
    chance: 50 %

# ── Soin et survie ────────────────────────────────────────────────────────
- cle: riz
  nom: Mets-le dans du riz
  court: RIZ
  type: action
  categorie: soin
  visuel: /assets/icones/bowl-of-rice.svg
  regle: >-
    Soigne un de tes héros — mais seulement à la FIN du tour suivant. Si
    l'adversaire l'achève d'ici là, le soin est perdu avec la carte.

- cle: lifeline
  nom: Lifeline
  court: LIFELINE
  type: passif
  categorie: soin
  visuel: /assets/cartes/carte-lifeline.svg
  forme: image
  regle: >-
    RÉGÉNÉRATION — +${soin} PV à un héros allié au début de chacun de tes
    tours, tant que le passif est en jeu.
  stats:
    soin: 2

- cle: totem
  nom: Le totem
  court: TOTEM
  type: passif
  categorie: soin
  visuel: /assets/cartes/carte-totem.svg
  forme: image
  regle: >-
    Une fois, un de tes héros MORTS revient en jeu avec la moitié de ses PV,
    arrondie au supérieur.

- cle: statue_mirage
  nom: La statue de Mirage
  court: STATUE
  type: passif
  categorie: soin
  visuel: /assets/cartes/carte-statue-mirage.svg
  forme: image
  groupe: 3
  regle: >-
    PASSIF À REGROUPER — une fois les TROIS réunies et regroupées, tes cartes
    de soin ne coûtent plus rien.

- cle: baril_soins
  nom: Le baril de soins
  court: BARIL DE SOINS
  type: passif
  categorie: soin
  visuel: /assets/icones/gas-mask.svg
  regle: >-
    Tant qu'il est en jeu, TOUT baril posé soigne au lieu de blesser — y
    compris ceux de l'adversaire.

- cle: rhum
  nom: Un petit cadeau de Zeddo
  court: RHUM
  type: passif
  categorie: soin
  visuel: /assets/icones/beer-bottle.svg
  groupe: 3
  regle: >-
    PASSIF À REGROUPER — chaque Rhum en jeu fait perdre ${pv} PV tous les
    ${tours} tours à son porteur. Les TROIS regroupées donnent ${chance}
    d'esquive.
  stats:
    pv: 1
    tours: 5
    chance: 50 %

- cle: clavier_souris
  nom: Le clavier-souris
  court: CLAVIER-SOURIS
  type: passif
  categorie: soin
  visuel: /assets/cartes/carte-clavier-souris.png
  forme: image
  regle: >-
    Tant qu'elle est en jeu, tes héros ont ${chance} de chance d'esquiver une
    attaque.
  stats:
    chance: 20 %

- cle: push_3_teams
  nom: Pouvoir de l'amitié !
  court: AMITIÉ
  type: action
  categorie: soin
  visuel: /assets/cartes/carte-push-3-teams.png
  forme: image
  regle: >-
    Augmente l'Attaque d'UN SEUL de tes héros, et l'Aura de TOUS.

- cle: pizzas
  nom: 10 pizzas géantes
  court: PIZZAS
  type: action
  categorie: soin
  visuel: /assets/icones/full-pizza.svg
  semis: 10
  regle: Rend ${soin} PV à tous tes héros.
  stats:
    soin: 4

# ── Contrôle et entrave ───────────────────────────────────────────────────
- cle: chevreuil
  nom: POV le chevreuil
  court: CHEVREUIL
  type: action
  categorie: controle
  visuel: /assets/icones/deer.svg
  regle: >-
    Pose STUN sur un héros adverse — il n'attaque pas ce tour, sans condition.
    Figé dans les phares.

- cle: tunnel_rina
  nom: Encore une histoire de Rina...
  court: TUNNEL
  type: action
  categorie: controle
  visuel: /assets/cartes/carte-tunnel.png
  forme: image
  regle: >-
    Pose l'état TUNNEL sur un héros adverse — il ne peut plus attaquer que le
    tien, ${tours} tours.
  stats:
    tours: 2

- cle: veto
  nom: Rendez-vous au véto
  court: VÉTO
  type: action
  categorie: controle
  visuel: /assets/icones/rod-of-asclepius.svg
  regle: >-
    Un de tes héros quitte la table pour un tour : il ne peut ni agir ni être
    touché, et il revient complètement soigné.

- cle: scan_seer
  nom: Le scan de Seer
  court: SCAN
  type: action
  categorie: controle
  visuel: /assets/cartes/carte-scan-seer.svg
  forme: image
  regle: Désactive TOUS les passifs adverses pendant ${tours} tours.
  stats:
    tours: 2

- cle: feur
  nom: Quoi → FEUR
  court: FEUR
  type: action
  categorie: controle
  # Une carte dont la vanne EST un mot ne gagne rien à un pictogramme : « FEUR »
  # n'a pas d'objet à dessiner, il a une réplique. Le mot prend donc la place
  # de l'illustration, pas celle du titre.
  texte: FEUR
  regle: Annule la prochaine ACTION jouée par l'adversaire ce tour.

- cle: steak_meliodas
  nom: Le steak haché de Meliodas
  court: STEAK HACHÉ
  type: action
  categorie: controle
  visuel: /assets/icones/steak.svg
  regle: >-
    Désigne un héros adverse : ce tour, il ne reçoit ni Aura ni soin de son
    camp. Seul dans son assiette.

- cle: raciste
  nom: Raciste
  court: RACISTE
  type: action
  categorie: controle
  visuel: /assets/icones/wheat.svg
  regle: >-
    Un de tes héros se spécialise : il gagne beaucoup d'Attaque, mais ne peut
    plus changer de cible — il tape le même héros adverse jusqu'à ce qu'il
    tombe.

- cle: perk
  nom: Azraël met ta perk !
  court: PERK
  type: action
  categorie: controle
  visuel: /assets/icones/dunce-cap.svg
  regle: >-
    Un héros adverse a une chance d'oublier d'attaquer, à chacun de ses tours,
    pendant quelques tours.

- cle: revision_meliodas
  nom: Séance de révision avec Meliodas
  court: RÉVISION
  type: action
  categorie: controle
  visuel: /assets/icones/book-pile.svg
  face_cachee: true
  regle: >-
    Pose-la FACE CACHÉE : elle gagne ${attaque} d'Attaque par tour passé
    ainsi, et toi seul vois le compteur, au dos. Retourne-la quand tu veux,
    l'Attaque accumulée se répartit AU HASARD entre tes héros. Si
    l'adversaire la détruit avant, tout est perdu.
  stats:
    attaque: 1

- cle: explication_requin
  nom: Requin qui tente d'expliquer
  court: EXPLICATION
  type: action
  categorie: controle
  # Le MÊME pochoir que `tunnel_rina`, et c'est voulu (owner, 2026-09-12).
  visuel: /assets/cartes/carte-tunnel.png
  forme: image
  regle: >-
    Les cartes de l'adversaire lui coûtent ${energie} d'énergie de plus ce
    tour.
  stats:
    energie: 1

- cle: anneau_raiky
  nom: Raiky dans l'anneau
  court: ANNEAU
  type: passif
  categorie: controle
  visuel: /assets/icones/death-zone.svg
  regle: >-
    Reste sur la table, FACE VISIBLE. À chaque tour, TOUS les héros perdent
    ${degats} PV, les tiens comme ceux d'en face.
  stats:
    degats: 1

- cle: montage_malef
  nom: Un montage de Malef
  court: MONTAGE
  type: action
  categorie: controle
  visuel: /assets/icones/vhs.svg
  regle: >-
    Annule tout ce qui s'est passé pendant le tour précédent : les dégâts, les
    soins, les états. On refait la prise.

- cle: leurre
  nom: Le leurre
  court: LEURRE
  type: action
  categorie: controle
  visuel: /assets/cartes/carte-leurre.svg
  forme: image
  regle: >-
    Double un de tes héros en jeu ; une seule des deux copies est vraie.
    Attaquer la fausse la détruit et COÛTE LE TOUR de l'attaquant.

- cle: anti_cheat
  nom: L'anti-cheat
  court: ANTI-CHEAT
  type: action
  categorie: controle
  visuel: /assets/icones/skull-mask.svg
  regle: >-
    Pose-la FACE VISIBLE et désigne un héros adverse : il ne peut plus rien
    faire pendant ${tours} tours. Mais ${chance}, le ban tombe sur un des
    TIENS à la place. Il n'avait rien fait.
  stats:
    tours: null
    chance: une fois sur quatre

# ── Aura et coopération ───────────────────────────────────────────────────
- cle: apero_zeddo
  nom: Apéro chez Zeddo
  court: APÉRO
  type: action
  categorie: aura
  visuel: /assets/icones/glass-celebration.svg
  regle: >-
    Tous tes héros gagnent beaucoup d'Aura ce tour, puis perdent ${pv} PV au
    tour suivant. C'était une bonne soirée.
  stats:
    pv: null

- cle: notre_kill
  nom: « C'est mon kill » / « NOTRE kill »
  court: NOTRE KILL
  type: action
  categorie: aura
  visuel: /assets/icones/hammer-sickle.svg
  regle: >-
    Copie un passif adverse tiré au hasard : son effet s'applique aussi à toi.
    Les passifs de l'adversaire sont cachés, tu ne sais pas lequel tu prends.

- cle: pika
  nom: Pika
  court: PIKA
  type: passif
  categorie: aura
  visuel: /assets/cartes/carte-chat.png
  forme: image
  regle: >-
    Tant qu'elle est en jeu, tu vois les passifs de l'adversaire, qui sont
    normalement cachés.

- cle: spiro
  nom: Spiro
  court: SPIRO
  type: action
  categorie: aura
  visuel: /assets/cartes/carte-chat.png
  forme: image
  regle: >-
    Lance-la sur un héros adverse : il a une chance de rater sa prochaine
    attaque.

- cle: lyly
  nom: Lyly
  court: LYLY
  type: action
  categorie: aura
  visuel: /assets/cartes/carte-chat.png
  forme: image
  regle: >-
    Lance-la sur un héros adverse : pendant ${tours} tours, il attaque une
    cible tirée au hasard, y compris ses propres alliés.
  stats:
    tours: null

- cle: les_trois_chats
  nom: Pika, Spiro et Lyly
  court: LES TROIS CHATS
  type: passif
  categorie: aura
  visuel: /assets/cartes/carte-chat.png
  forme: image
  # L'ARC est le contraire du semis : le semis veut du désordre (dix pizzas
  # jetées), l'arc veut une figure. C'est ce qui dit « ensemble ».
  semis: 3
  arc: true
  regle: >-
    Tant qu'elle est en jeu, chaque fois que tu joues Pika, Spiro ou Lyly, la
    carte revient dans ta main au lieu de partir à la défausse.

- cle: piercing
  nom: Un piercing de petitpoissonnn
  court: PIERCING
  type: action
  categorie: aura
  visuel: /assets/icones/heart-earrings.svg
  regle: >-
    +${aura} d'Aura à un héros allié pour la partie, ET il perd ${pv} PV.
  stats:
    aura: 3
    pv: 1

# ── Ressource ─────────────────────────────────────────────────────────────
