# Les cartes TERMINÉES du TCG du Purgatoire — la source unique.
#
# Ce fichier est LA donnée ; `bot/core/tcg_cartes.py` ne fait que la lire et la
# valider. Il est bind-monté (`./tcg:/app/tcg:ro`) : le corriger ne demande PAS
# de rebuild, seulement un `docker compose restart wally` — il est lu au boot,
# comme les prompts de cognition.
#
# 🚨 CE FICHIER NE PORTE QUE CE QUE NOTION PORTE. La base
# « 🃏 Cartes du Purgatoire » est la SEULE source des chiffres, des ultimes et
# des paliers de rareté. Relevé le 2026-09-09 : Azraël est la seule carte dont
# Notion tienne des valeurs (coût d'ultime 10, 5/10/5, « F07 Rework », statut
# « en cours ») ; les quatre autres sont « à écrire » et n'ont RIEN.
#
# 🚨 Corollaire : tout ce qui n'est pas décidé vaut 0 ou « INDÉFINI », et se
# lit comme tel sur la carte. Jusqu'au 2026-09-09 le fichier portait des
# chiffres de maquette (Claker 8/5/4/3, Lilith 7/6/6/5…) qui ne sortaient
# d'aucune décision : à l'écran, rien ne les distinguait de vraies valeurs, et
# la page `/tcg` était seule à prévenir. Un placeholder qui ressemble à une
# donnée finit par être lu comme une donnée.
#
# 🚨 Ne JAMAIS justifier une valeur d'ici par le barème (« budget 12 +
# rareté », « ce palier vaut +8 »). Trois commentaires de ce genre ont été
# écrits le 2026-09-07 sur des chiffres qui ne sortaient d'aucun calcul — une
# justification fausse coûte plus cher qu'une absence de justification, elle
# envoie vérifier une règle qui n'a jamais été appliquée.
#
# 🚨 `accent` N'EXISTE PLUS comme champ : la couleur DÉRIVE du coût de
# l'ultime (`accent_du_cout` dans `bot/core/tcg_cartes.py`). En écrire une ici
# lève au chargement. Écrite à la main, elle disait l'humeur de l'illustration
# et rien du jeu.
#
# ⚠️ L'ORDRE COMPTE, mais ce n'est PLUS celui de la collection à l'écran
# depuis le 2026-09-09 : `par_prestige()` la reclasse de la plus haute à la
# plus basse. Ici, l'ordre dit dans quel ordre les cartes ont été FINIES — et
# c'est lui qui départage deux cartes de même rang, le tri étant stable.
#
# ⚠️ Une carte n'entre ici que si son ILLUSTRATION EXISTE. Ce n'est pas la
# liste des cartes prévues, c'est la liste de celles qu'on peut montrer : le
# site affiche exactement ce contenu et son compteur en dérive. Une entrée sans
# image donnerait une carte noire annoncée comme terminée.
#
# ⚠️ Les champs d'illustration portent un chemin SANS extension : le front sert
# l'AVIF avec repli WebP et ajoute l'extension lui-même. En écrire une ici
# donnerait `/assets/x.webp.avif`.
#
# ⚠️ `holo_force` (0 à 1) dose le vitrage CARTE PAR CARTE — grain, contraste et
# saturation montent ensemble. Aucune carte ne l'écrit aujourd'hui, toutes
# prennent la dose pleine (1,0) choisie sur un banc le 2026-09-09. Il est là
# pour le jour où une carte devra diverger : le fond d'Azraël est une explosion
# orange claire, celui de KingsRequin un bleu sombre dont le vitrage court dans
# le liseré — ils n'auront pas éternellement le même besoin.
#
# Les champs omis prennent le défaut de `CarteTcg` (`bot/core/tcg_cartes.py`).
# Un champ inconnu est une ERREUR au chargement, et pas un réglage ignoré en
# silence : c'est tout l'intérêt d'avoir sorti ces valeurs du code.

- cle: azrael
  nom: AZRAËL
  legende: AZRAËL · ARCHANGE
  classe: ARCHANGE
  ultime: REWORK
  rarete: archange
  description: >-
    Rework : désigne un héros adverse. Pour le reste de la partie, son Ultime
    coûte +3 et tous ses nombres baissent de 2.
  ambiance: >-
    Il ne te dit jamais non. Il attend le prochain patch, et un matin plus
    personne ne te craint.
  cout: 10
  atk: 5
  pv: 10
  aura: 5
  hero: /assets/tcg-azrael-hero
  fond: /assets/tcg-azrael-fond
  # « azra » est ce qu'on tape dans un chat, et rien ne le résolvait : cette
  # carte était la SEULE sans alias. Le tréma, lui, n'en demande pas —
  # `normaliser()` le retire avant de comparer.
  alias: [azra]
  holographique: true

- cle: claker
  nom: CLAKER
  legende: CLAKERNOJUTSU · ÂME
  classe: ÂME · NO JUTSU
  ultime: INDÉFINI
  rarete: ame
  description: INDÉFINI
  ambiance: Il ne demande pas si tu suis. Il vérifie.
  cout: 0
  atk: 0
  pv: 0
  aura: 0
  hero: /assets/tcg-claker-hero
  fond: /assets/tcg-claker-fond
  alias: [claker, clakernojutsu, clacker, clackernojutsu]
  # Ses pieds passent DEVANT lui : c'est la couche d'avant-plan, et c'est elle
  # qui donne la profondeur quand la carte s'ouvre.
  avant_plan: /assets/tcg-claker-pieds
  avant_plan_largeur: 100%
  avant_plan_bas: 15%
  hero_cote: 5%
  hero_haut: -8%
  hero_echelle: 1.1
  particules: poussiere
  parallaxe: 0.9
  intensite: 0.6

- cle: rhae
  nom: RHAE
  legende: RHAE___ · FÉLIN
  classe: FÉLIN
  ultime: INDÉFINI
  rarete: ange
  description: INDÉFINI
  ambiance: INDÉFINI
  cout: 0
  atk: 0
  pv: 0
  aura: 0
  fond: /assets/tcg-rhae-fond
  # DEUX visuels (comme KingsRequin) : portrait assis, cadré serré, au repos ;
  # bond griffes en avant, bien plus large que la carte, au survol.
  hero: /assets/tcg-rhae-hero-2d
  hero_cote: 8%
  hero_haut: -2%
  hero_3d: /assets/tcg-rhae-hero-3d
  hero_3d_cote: -26%
  hero_3d_haut: 6%
  alias: [rhae, rhae_, rhae__, rhae___]
  particules: poussiere
  parallaxe: 1.1
  intensite: 0.8
  holographique: true

- cle: lilith
  nom: LILITH
  legende: LILITH · DÉMON
  classe: DÉMON
  ultime: INDÉFINI
  rarete: indefinie
  description: INDÉFINI
  ambiance: INDÉFINI
  cout: 0
  atk: 0
  pv: 0
  aura: 0
  # Ailes déployées : l'illustration fait presque deux fois la largeur de la
  # carte. Au repos les pointes sont rognées, au survol elles sortent.
  hero: /assets/tcg-lilith-hero
  fond: /assets/tcg-lilith-fond
  alias: [lilith]
  hero_cote: -40%
  # 5 % et non 4 % : plus bas, le bas de l'illustration (elle s'arrête aux
  # mollets) sort de derrière la fiche quand le parallaxe déplace le calque
  # libre, et les jambes ont l'air coupées net.
  hero_haut: 5%
  hero_echelle: 1.08
  particules: poussiere
  intensite: 0.75

- cle: kingsrequin
  nom: KINGSREQUIN
  legende: KINGSREQUIN · REQUIN
  classe: REQUIN
  ultime: INDÉFINI
  rarete: indefinie
  description: INDÉFINI
  ambiance: INDÉFINI
  cout: 0
  atk: 0
  pv: 0
  aura: 0
  fond: /assets/tcg-requin-fond
  # Deux visuels comme rhae___ : le portrait au repos, le second au survol.
  hero: /assets/tcg-requin-hero-2d
  hero_cote: -5%
  hero_haut: 10%
  hero_3d: /assets/tcg-requin-hero-3d
  # `-0%` dans l'éditeur, et c'est la même valeur CSS que `0%`.
  hero_3d_haut: 0%
  hero_3d_cote: -5%
  hero_echelle: 1.08
  alias: [kingsrequin, requin, kingrequin]
  particules: poussiere
  parallaxe: 1.2
  intensite: 0.8
  holographique: true
  # Son fond est un bleu saturé : un chatoiement de surface y rendrait un voile
  # blanc. Il court donc dans le liseré.
  holo_zone: bords
  bulles: true

- cle: wally
  nom: WALLY
  legende: WALLY · ARCHANGE
  classe: ARCHANGE
  ultime: INDÉFINI
  rarete: indefinie
  description: INDÉFINI
  ambiance: INDÉFINI
  cout: 0
  atk: 0
  pv: 0
  aura: 0
  fond: /assets/tcg-wally-fond
  # Deux visuels : au repos une silhouette cadrée très serré — 24 % de chaque
  # côté, soit à peine la moitié de la carte — et au survol un plan bien plus
  # large, qui l'agrandit encore de 14 %.
  hero: /assets/tcg-wally-hero-2d
  hero_cote: 24%
  hero_haut: 2%
  hero_3d: /assets/tcg-wally-hero-3d
  hero_3d_cote: 6%
  hero_3d_haut: -2%
  hero_echelle: 1.14
  parallaxe: 1.2
  intensite: 0.9
  holographique: true

- cle: meliodas
  nom: MÉLIODAS
  legende: MÉLIODAS · INDÉFINIE
  classe: INDÉFINIE
  ultime: INDÉFINI
  rarete: indefinie
  description: INDÉFINI
  ambiance: INDÉFINI
  cout: 0
  atk: 0
  pv: 0
  aura: 0
  fond: /assets/tcg-meliodas-fond
  # UNE seule illustration pour les deux états, avec deux cadrages : elle se
  # recentre et s'élargit quand la carte s'ouvre. `hero_3d` reste donc absent
  # — le rendu reprend `hero` de lui-même — et seuls les décalages changent.
  hero: /assets/tcg-meliodas-hero
  hero_cote: 8%
  hero_haut: 3%
  hero_3d_cote: -6%
  hero_3d_haut: 0%
  particules: poussiere
  intensite: 0.8
  bulles: true
